<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hexadox MIS - Edit Submitted Data</title>
<link rel="stylesheet" href="theme-yellow.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f6;color:#222}.header{background:#f4c400;color:#111;padding:18px 25px;display:flex;justify-content:space-between;align-items:center}.header h2{margin:0;font-size:22px}.btn{border:0;padding:10px 18px;border-radius:6px;cursor:pointer;font-weight:bold;background:#f4c400;color:#111}.btn:disabled{opacity:.6;cursor:not-allowed}.back{background:#fff}.container{max-width:1250px;margin:25px auto;padding:0 15px}.card{background:#fff;padding:22px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin:0 0 20px}.toggle{display:flex;gap:10px;margin-bottom:20px}.toggle .btn{background:#fff;border:1px solid #d0a900}.toggle .active{background:#f4c400}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}label{display:block;font-weight:bold;margin-bottom:7px}select,input{width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;font-size:15px}select:disabled{background:#eee}.info{background:#fff8d6;border-left:5px solid #f4c400;padding:12px 15px;margin-bottom:18px}.table-container{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:980px}th{background:#f4c400;color:#111;padding:11px 8px;text-align:center}td{padding:8px;border-bottom:1px solid #ddd;text-align:center}td.product{text-align:left;font-weight:500}td input{width:115px;text-align:right}.value{font-weight:bold;text-align:right}.message{margin-top:15px;padding:12px;border-radius:5px;display:none;text-align:center;font-weight:bold}.success{background:#d9f5e9;color:#146c43}.error{background:#f8d7da;color:#842029}.loading{text-align:center;padding:25px;font-weight:bold}.hidden{display:none!important}.changed{background:#fff3bf!important;border-color:#d0a900!important}.add-product-bar{display:flex;gap:10px;align-items:center;margin:0 0 15px}.add-product-bar select{max-width:420px}.remove-btn{background:#f8d7da;color:#842029;border:1px solid #e3a6ad;padding:7px 10px;border-radius:5px;cursor:pointer;font-weight:bold}.remove-btn:hover{background:#f1c2c7}.new-row{background:#fffdf0}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid{grid-template-columns:1fr}.toggle{flex-direction:column}.header h2{font-size:18px}.add-product-bar{flex-direction:column;align-items:stretch}.add-product-bar select{max-width:none}}
</style>
</head>
<body>
<div class="header"><h2>HEXADOX MIS — EDIT SUBMITTED DATA</h2><button class="btn back" onclick="goHome()">HOME</button></div>
<div class="container">
<div class="card">
<h3>Edit Existing Data</h3>
<div class="toggle"><button id="salesMode" class="btn active" onclick="setMode('sales')">EDIT SUBMITTED SALES</button><button id="targetMode" class="btn" onclick="setMode('targets')">EDIT TARGET SHEET</button></div>
<div id="salesInfo" class="info">For submitted sales, select Month, Year, HQ and Stockist.</div>
<div id="targetInfo" class="info hidden">For target sheets, select Month, Year and HQ. Stockist is not required.</div>
<div class="grid">
<div><label>Month</label><select id="month"><option value="">Select Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select></div>
<div><label>Year</label><select id="year"><option value="">Select Year</option></select></div>
<div><label>HQ</label><select id="hq"><option value="">Loading HQ...</option></select></div>
<div id="stockistBox"><label>Stockist</label><select id="stockist" disabled><option value="">Select Stockist</option></select></div>
</div>
<div style="text-align:center;margin-top:22px"><button id="loadButton" class="btn" onclick="loadCurrentData()">LOAD SUBMITTED SALES</button></div>
</div>
<div class="card"><h3 id="resultTitle">Submitted Product Data</h3><div id="productArea"><div class="loading">Select the entry and click LOAD.</div></div><div id="saveArea" class="hidden" style="text-align:center;margin-top:25px"><button id="saveButton" class="btn" onclick="saveCurrentData()">SAVE CHANGES</button></div></div>
<div id="message" class="message"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script>
<script>
let mode='sales',currentHeader=null,salesDetails=[],activeProducts=[],targetRows=[];
function setMode(m){mode=m;document.getElementById('salesMode').classList.toggle('active',m==='sales');document.getElementById('targetMode').classList.toggle('active',m==='targets');document.getElementById('salesInfo').classList.toggle('hidden',m!=='sales');document.getElementById('targetInfo').classList.toggle('hidden',m!=='targets');document.getElementById('stockistBox').classList.toggle('hidden',m==='targets');document.getElementById('loadButton').textContent=m==='sales'?'LOAD SUBMITTED SALES':'LOAD TARGET SHEET';document.getElementById('resultTitle').textContent=m==='sales'?'Submitted Product Data':'Submitted Target Sheet';document.getElementById('productArea').innerHTML='<div class="loading">Select the filters and click LOAD.</div>';document.getElementById('saveArea').classList.add('hidden');if(m==='sales')loadStockists()}
async function initializePage(){const{data,error}=await client.auth.getSession();if(error||!data.session){location.href='index.html';return}loadYears();const d=new Date();month.value=d.getMonth()+1;year.value=d.getFullYear();await loadHQs()}
function loadYears(){const s=year,y=new Date().getFullYear();for(let n=y-2;n<=y+1;n++)s.appendChild(new Option(n,n))}
async function loadHQs(){const s=hq,{data,error}=await client.from('hqs').select('id,hq_name').eq('active',true).order('hq_name');if(error){showMessage('Unable to load HQs: '+error.message,'error');return}s.innerHTML='<option value="">Select HQ</option>';(data||[]).forEach(x=>s.appendChild(new Option(x.hq_name,x.id)))}
hq.addEventListener('change',()=>{if(mode==='sales')loadStockists()});
async function loadStockists(){const h=hq.value,s=stockist;s.disabled=true;s.innerHTML='<option value="">Loading Stockists...</option>';if(!h){s.innerHTML='<option value="">Select Stockist</option>';return}const{data,error}=await client.from('stockists').select('id,stockist_name').eq('hq_id',h).eq('active',true).order('stockist_name');if(error){showMessage('Unable to load stockists: '+error.message,'error');return}s.innerHTML='<option value="">Select Stockist</option>';(data||[]).forEach(x=>s.appendChild(new Option(x.stockist_name,x.id)));s.disabled=false}
async function loadCurrentData(){if(mode==='sales')await loadSales();else await loadTargets()}
async function loadSales(){const m=+month.value,y=+year.value,h=hq.value,s=stockist.value;if(!m||!y||!h||!s){showMessage('Please select Month, Year, HQ and Stockist.','error');return}setLoading(true,'Loading submitted sales...');try{const{data:heads,error:he}=await client.from('sales_entry_header').select('id,stockist_id,hq_id,month,year').eq('stockist_id',s).eq('hq_id',h).eq('month',m).eq('year',y).limit(1);if(he)throw he;if(!heads?.length)throw new Error('No submitted sales found for this Month, Year, HQ and Stockist.');currentHeader=heads[0];const{data:rows,error:de}=await client.from('sales_entry_details').select('id,product_id,pts,primary_units,primary_value,secondary_units,secondary_value,products(product_name)').eq('entry_id',currentHeader.id).order('id');if(de)throw de;salesDetails=(rows||[]).filter(r=>(Number(r.primary_units)||0)!==0||(Number(r.secondary_units)||0)!==0||(Number(r.pts)||0)!==0).sort((a,b)=>String(a.products?.product_name||'').localeCompare(String(b.products?.product_name||''),undefined,{numeric:true,sensitivity:'base'}));const{data:prods,error:pe}=await client.from('products').select('id,product_name').eq('active',true).order('product_name');if(pe)throw pe;activeProducts=prods||[];renderSales()}catch(e){productArea.innerHTML='<div class="message error" style="display:block">'+escapeHTML(e.message)+'</div>'}finally{setLoading(false)}}
function renderSales(){let html='<div class="info">Add a brand to include a new product, or use REMOVE on a row to remove it from this submitted entry. Changes are only permanent after SAVE CHANGES.</div><div class="add-product-bar"><select id="addProductSelect"><option value="">Select brand/product to add</option>';const used=new Set(salesDetails.map(r=>String(r.product_id)));activeProducts.filter(p=>!used.has(String(p.id))).forEach(p=>html+='<option value="'+p.id+'">'+escapeHTML(p.product_name)+'</option>');html+='</select><button class="btn" type="button" onclick="addProductRow()">+ ADD BRAND</button></div><div class="table-container"><table><thead><tr><th>#</th><th>Product</th><th>PTS</th><th>Primary Units</th><th>Primary Value</th><th>Secondary Units</th><th>Secondary Value</th><th>Action</th></tr></thead><tbody>';salesDetails.forEach((r,i)=>html+=salesRowHTML(r,i,false));html+='</tbody></table></div>';productArea.innerHTML=html;saveArea.classList.remove('hidden');attachSalesCalculation()}
function salesRowHTML(r,i,isNew){const id=r.id||('new_'+r.product_id);return '<tr class="'+(isNew?'new-row':'')+'" data-row-id="'+id+'" data-product-id="'+r.product_id+'"><td>'+(i+1)+'</td><td class="product">'+escapeHTML(r.products?.product_name||r.product_name||'')+'</td><td><input type="number" min="0" step="0.01" data-sales="'+id+'" data-field="pts" value="'+(r.pts??'')+'"></td><td><input type="number" step="1" min="0" data-sales="'+id+'" data-field="primary_units" value="'+(r.primary_units??0)+'"></td><td class="value" data-value="'+id+'" data-value-type="primary">'+formatValue(calcValue(r.pts,r.primary_units))+'</td><td><input type="number" step="1" min="0" data-sales="'+id+'" data-field="secondary_units" value="'+(r.secondary_units??0)+'"></td><td class="value" data-value="'+id+'" data-value-type="secondary">'+formatValue(calcValue(r.pts,r.secondary_units))+'</td><td><button class="remove-btn" type="button" onclick="removeProductRow(\''+id+'\')">REMOVE</button></td></tr>'}
function addProductRow(){const sel=document.getElementById('addProductSelect');const productId=sel?.value;if(!productId){showMessage('Please select a brand/product to add.','error');return}if(salesDetails.some(r=>String(r.product_id)===String(productId))){showMessage('That brand/product is already in this entry.','error');return}const p=activeProducts.find(x=>String(x.id)===String(productId));if(!p)return;const newRow={id:null,product_id:p.id,pts:0,primary_units:0,secondary_units:0,products:{product_name:p.product_name},isNew:true};salesDetails.push(newRow);renderSales();showMessage(p.product_name+' added. Enter PTS and quantities, then SAVE CHANGES.','success')}
function removeProductRow(id){const row=salesDetails.find(r=>String(r.id||('new_'+r.product_id))===String(id));if(!row)return;const name=row.products?.product_name||row.product_name||'product';if(!confirm('Remove '+name+' from this submitted entry?'))return;salesDetails=salesDetails.filter(r=>String(r.id||('new_'+r.product_id))!==String(id));renderSales();showMessage(name+' marked for removal. Click SAVE CHANGES to permanently remove it.','success')}
function calcValue(pts,units){return Number((Number(pts)||0)*(Number(units)||0)).toFixed(2)}
function attachSalesCalculation(){document.querySelectorAll('[data-sales]').forEach(input=>input.addEventListener('input',()=>{const id=input.dataset.sales;const rowInputs=document.querySelectorAll('[data-sales="'+id+'"]');let pts=0,pu=0,su=0;rowInputs.forEach(x=>{const v=x.value===''?0:Number(x.value)||0;if(x.dataset.field==='pts')pts=v;else if(x.dataset.field==='primary_units')pu=v;else if(x.dataset.field==='secondary_units')su=v;x.classList.add('changed')});const pv=document.querySelector('[data-value="'+id+'"][data-value-type="primary"]');const sv=document.querySelector('[data-value="'+id+'"][data-value-type="secondary"]');if(pv)pv.textContent=formatValue(calcValue(pts,pu));if(sv)sv.textContent=formatValue(calcValue(pts,su))}))}
async function saveSales(){if(!currentHeader)return;const b=document.getElementById('saveButton');b.disabled=true;b.textContent='SAVING...';try{const desired=[];document.querySelectorAll('tr[data-product-id]').forEach(tr=>{const productId=tr.dataset.productId;const id=tr.dataset.rowId;const get=f=>tr.querySelector('[data-sales="'+id+'"][data-field="'+f+'"]');if(!get)return;const pts=get('pts').value===''?0:parseFloat(get('pts').value);const pu=get('primary_units').value===''?0:parseInt(get('primary_units').value,10);const su=get('secondary_units').value===''?0:parseInt(get('secondary_units').value,10);if(!Number.isFinite(pts)||pts<0||!Number.isInteger(pu)||pu<0||!Number.isInteger(su)||su<0)throw new Error('Invalid values for '+(tr.querySelector('.product')?.textContent||'product'));desired.push({id:id.startsWith('new_')?null:id,product_id:productId,pts,primary_units:pu,secondary_units:su})});const desiredIds=new Set();for(const r of desired){if(r.id){desiredIds.add(String(r.id));const{error}=await client.from('sales_entry_details').update({pts:r.pts,primary_units:r.primary_units,primary_value:Number((r.pts*r.primary_units).toFixed(2)),secondary_units:r.secondary_units,secondary_value:Number((r.pts*r.secondary_units).toFixed(2))}).eq('id',r.id).eq('entry_id',currentHeader.id);if(error)throw error}else{const{error}=await client.from('sales_entry_details').insert({entry_id:currentHeader.id,product_id:r.product_id,pts:r.pts,primary_units:r.primary_units,primary_value:Number((r.pts*r.primary_units).toFixed(2)),secondary_units:r.secondary_units,secondary_value:Number((r.pts*r.secondary_units).toFixed(2))});if(error)throw error}}const{data:existing,error:ee}=await client.from('sales_entry_details').select('id').eq('entry_id',currentHeader.id);if(ee)throw ee;for(const old of existing||[]){if(!desiredIds.has(String(old.id))){const{error}=await client.from('sales_entry_details').delete().eq('id',old.id).eq('entry_id',currentHeader.id);if(error)throw error}}showMessage('Saved successfully. Products added/removed and PTS and quantities have been updated.','success');await loadSales()}catch(e){showMessage('Unable to update submitted sales: '+e.message,'error')}finally{b.disabled=false;b.textContent='SAVE CHANGES'}}
async function loadTargets(){const m=+month.value,y=+year.value,h=hq.value;if(!m||!y||!h){showMessage('Please select Month, Year and HQ.','error');return}setLoading(true,'Loading target sheet...');try{const{data:prods,error:pe}=await client.from('products').select('id,product_name').eq('active',true).order('product_name');if(pe)throw pe;activeProducts=(prods||[]).sort((a,b)=>String(a.product_name||'').localeCompare(String(b.product_name||''),undefined,{numeric:true,sensitivity:'base'}));const{data:rows,error:te}=await client.from('targets').select('id,product_id,target_units').eq('month',m).eq('year',y).eq('hq_id',h);if(te)throw te;targetRows=rows||[];renderTargets()}catch(e){productArea.innerHTML='<div class="message error" style="display:block">'+escapeHTML(e.message)+'</div>'}finally{setLoading(false)}}
function renderTargets(){const map={};targetRows.forEach(r=>map[r.product_id]=r);let html='<div class="info">Target sheets contain units only. Clear Units to remove that product target.</div><div class="table-container"><table><thead><tr><th>#</th><th>Product</th><th>Target Units</th></tr></thead><tbody>';activeProducts.forEach((p,i)=>{const u=(map[p.id]||{}).target_units??'';html+='<tr><td>'+(i+1)+'</td><td class="product">'+escapeHTML(p.product_name)+'</td><td><input type="number" min="0" step="1" class="target-unit" data-product="'+p.id+'" value="'+u+'"></td></tr>'});html+='</tbody></table></div>';productArea.innerHTML=html;saveArea.classList.remove('hidden')}
async function saveCurrentData(){if(mode==='sales')await saveSales();else await saveTargets()}
function formatValue(v){return(Number(v)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
async function saveTargets(){const m=+month.value,y=+year.value,h=hq.value;if(!m||!y||!h||!activeProducts.length){showMessage('Please select Month, Year and HQ and load the target sheet.','error');return}const b=document.getElementById('saveButton');b.disabled=true;b.textContent='SAVING...';try{const desired=[];for(const p of activeProducts){const text=document.querySelector('.target-unit[data-product="'+p.id+'"]').value.trim()||'';if(!text)continue;const u=parseInt(text,10);if(!Number.isInteger(u)||u<0)throw new Error('Invalid Target Units for '+p.product_name);desired.push({product_id:p.id,target_units:u})}for(const row of desired){const{data:existing,error:qe}=await client.from('targets').select('id').eq('month',m).eq('year',y).eq('hq_id',h).eq('product_id',row.product_id).limit(1);if(qe)throw qe;const payload={target_pts:0,target_units:row.target_units};const{error}=existing?.length?await client.from('targets').update(payload).eq('id',existing[0].id):await client.from('targets').insert({month:m,year:y,hq_id:h,...row});if(error)throw error}const{data:existingAll,error:ae}=await client.from('targets').select('id,product_id').eq('month',m).eq('year',y).eq('hq_id',h);if(ae)throw ae;const keep=new Set(desired.map(r=>String(r.product_id)));for(const old of existingAll||[]){if(!keep.has(String(old.product_id))){const{error}=await client.from('targets').delete().eq('id',old.id);if(error)throw error}}showMessage('Target units saved successfully: '+desired.length+' product rows.','success');await loadTargets()}catch(e){showMessage('Unable to update target sheet: '+e.message,'error')}finally{b.disabled=false;b.textContent='SAVE CHANGES'}}
function setLoading(on,text){loadButton.disabled=on;if(on)loadButton.textContent=text;else loadButton.textContent=mode==='sales'?'LOAD SUBMITTED SALES':'LOAD TARGET SHEET'}function showMessage(t,type){message.textContent=t;message.className='message '+type;message.style.display='block'}function escapeHTML(t){const d=document.createElement('div');d.textContent=t??'';return d.innerHTML}function goHome(){location.href='home.html'}initializePage();
</script></body></html>
