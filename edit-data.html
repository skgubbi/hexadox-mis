<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hexadox MIS - Edit Submitted Data</title>
<link rel="stylesheet" href="theme-yellow.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f6;color:#222}.header{background:#f4c400;color:#111;padding:18px 25px;display:flex;justify-content:space-between;align-items:center}.header h2{margin:0;font-size:22px}.back-button,.action-button,.toggle-button{border:0;padding:10px 18px;border-radius:6px;cursor:pointer;font-weight:bold}.back-button{background:#fff;color:#222}.container{max-width:1250px;margin:25px auto;padding:0 15px}.card{background:#fff;padding:22px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:20px}.card h3{margin-top:0}.view-toggle{display:flex;gap:10px;margin-bottom:20px}.toggle-button{background:#fff;border:1px solid #d0a900;color:#222}.toggle-button.active{background:#f4c400}.selection-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}label{display:block;font-weight:bold;margin-bottom:7px}select,input{width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;font-size:15px}select:disabled{background:#eee}.action-area{text-align:center;margin-top:22px}.action-button{background:#f4c400;color:#111}.action-button:disabled{background:#999;color:#fff;cursor:not-allowed}.table-container{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:850px}th{background:#f4c400;color:#111;padding:11px 8px;text-align:center}td{padding:8px;border-bottom:1px solid #ddd;text-align:center}td.product-name{text-align:left;font-weight:500}td input{width:115px;text-align:right}.value-cell{font-weight:bold;text-align:right}.totals-row{font-weight:bold;background:#f1f5f5}.info{background:#fff8d6;border-left:5px solid #f4c400;padding:12px 15px;margin-bottom:18px}.message{margin-top:15px;padding:12px;border-radius:5px;display:none;text-align:center;font-weight:bold}.success{background:#d9f5e9;color:#146c43}.error{background:#f8d7da;color:#842029}.loading{text-align:center;padding:25px;font-weight:bold}.hidden{display:none!important}@media(max-width:850px){.selection-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.selection-grid{grid-template-columns:1fr}.header h2{font-size:18px}.view-toggle{flex-direction:column}}
</style>
</head>
<body>
<div class="header"><h2>HEXADOX MIS — EDIT SUBMITTED DATA</h2><button class="back-button" onclick="goHome()">HOME</button></div>
<div class="container">
<div class="card">
<h3>Edit Existing Data</h3>
<div class="view-toggle"><button id="salesMode" class="toggle-button active" onclick="setMode('sales')">EDIT SUBMITTED SALES</button><button id="targetMode" class="toggle-button" onclick="setMode('targets')">EDIT TARGET SHEET</button></div>
<div id="salesInfo" class="info">For submitted sales, select Month, Year, HQ and Stockist.</div>
<div id="targetInfo" class="info hidden">For target sheets, select Month, Year and HQ. Stockist is not required because targets are HQ-wise.</div>
<div class="selection-grid">
<div><label for="month">Month</label><select id="month"><option value="">Select Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select></div>
<div><label for="year">Year</label><select id="year"><option value="">Select Year</option></select></div>
<div><label for="hq">HQ</label><select id="hq"><option value="">Loading HQ...</option></select></div>
<div id="stockistBox"><label for="stockist">Stockist</label><select id="stockist" disabled><option value="">Select Stockist</option></select></div>
</div>
<div class="action-area"><button id="loadButton" class="action-button" onclick="loadCurrentData()">LOAD SUBMITTED SALES</button></div>
</div>
<div class="card"><h3 id="resultTitle">Submitted Product Data</h3><div id="productArea"><div class="loading">Select the entry and click LOAD.</div></div><div id="saveArea" class="action-area hidden"><button id="saveButton" class="action-button" onclick="saveCurrentData()">SAVE CHANGES</button></div></div>
<div id="message" class="message"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script>
<script>
let mode='sales',currentHeader=null,salesDetails=[],targetRows=[],activeProducts=[];
function setMode(next){mode=next;document.getElementById('salesMode').classList.toggle('active',mode==='sales');document.getElementById('targetMode').classList.toggle('active',mode==='targets');document.getElementById('salesInfo').classList.toggle('hidden',mode!=='sales');document.getElementById('targetInfo').classList.toggle('hidden',mode!=='targets');document.getElementById('stockistBox').classList.toggle('hidden',mode==='targets');document.getElementById('loadButton').textContent=mode==='sales'?'LOAD SUBMITTED SALES':'LOAD TARGET SHEET';document.getElementById('resultTitle').textContent=mode==='sales'?'Submitted Product Data':'Submitted Target Sheet';document.getElementById('productArea').innerHTML='<div class="loading">Select the filters and click LOAD.</div>';document.getElementById('saveArea').classList.add('hidden');if(mode==='sales')loadStockists()}
async function initializePage(){const{data,error}=await client.auth.getSession();if(error||!data.session){location.href='index.html';return}loadYears();const d=new Date();document.getElementById('month').value=d.getMonth()+1;document.getElementById('year').value=d.getFullYear();await loadHQs()}
function loadYears(){const s=document.getElementById('year'),y=new Date().getFullYear();for(let n=y-2;n<=y+1;n++){const o=document.createElement('option');o.value=n;o.textContent=n;s.appendChild(o)}}
async function loadHQs(){const s=document.getElementById('hq');const{data,error}=await client.from('hqs').select('id,hq_name').eq('active',true).order('hq_name');if(error){showMessage('Unable to load HQs: '+error.message,'error');return}s.innerHTML='<option value="">Select HQ</option>';(data||[]).forEach(h=>{const o=document.createElement('option');o.value=h.id;o.textContent=h.hq_name;s.appendChild(o)})}
document.getElementById('hq').addEventListener('change',()=>{if(mode==='sales')loadStockists()});
async function loadStockists(){const h=document.getElementById('hq').value,s=document.getElementById('stockist');s.disabled=true;s.innerHTML='<option value="">Loading Stockists...</option>';if(!h){s.innerHTML='<option value="">Select Stockist</option>';return}const{data,error}=await client.from('stockists').select('id,stockist_name').eq('hq_id',h).eq('active',true).order('stockist_name');if(error){showMessage('Unable to load stockists: '+error.message,'error');return}s.innerHTML='<option value="">Select Stockist</option>';(data||[]).forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.stockist_name;s.appendChild(o)});s.disabled=false}
async function loadCurrentData(){mode==='sales'?await loadSales():await loadTargets()}
async function loadSales(){const m=+month.value,y=+year.value,h=hq.value,s=stockist.value;if(!m||!y||!h||!s){showMessage('Please select Month, Year, HQ and Stockist.','error');return}setLoading(true,'Loading submitted sales...');try{const{data:heads,error:he}=await client.from('sales_entry_header').select('id,stockist_id,hq_id,month,year,entered_by').eq('stockist_id',s).eq('hq_id',h).eq('month',m).eq('year',y).limit(1);if(he)throw he;if(!heads?.length){throw new Error('No submitted sales found for this Month, Year, HQ and Stockist.')}currentHeader=heads[0];const{data:rows,error:de}=await client.from('sales_entry_details').select('id,product_id,pts,primary_units,secondary_units,products(product_name)').eq('entry_id',currentHeader.id).order('id');if(de)throw de;const{data:prods,error:pe}=await client.from('products').select('id,product_name').eq('active',true).order('product_name');if(pe)throw pe;activeProducts=prods||[];salesDetails=(rows||[]).filter(r=>Number(r.primary_units)||Number(r.secondary_units));renderSales()}catch(e){document.getElementById('productArea').innerHTML='<div class="message error" style="display:block">'+escapeHTML(e.message)+'</div>'}finally{setLoading(false)}}
function renderSales(){const existing=new Set(salesDetails.map(r=>String(r.product_id)));const rows=[...salesDetails].sort((a,b)=>(a.products?.product_name||'').localeCompare(b.products?.product_name||'',undefined,{sensitivity:'base'}));let html='<div class="table-container"><table><thead><tr><th>#</th><th>Product</th><th>PTS</th><th>Primary Units</th><th>Secondary Units</th></tr></thead><tbody>';rows.forEach((r,i)=>{html+='<tr><td>'+(i+1)+'</td><td class="product-name">'+escapeHTML(r.products?.product_name||'')+'</td><td><input type="number" step="0.01" min="0" data-type="sales" data-id="'+r.id+'" data-field="pts" value="'+(r.pts??'')+'"></td><td><input type="number" step="1" data-type="sales" data-id="'+r.id+'" data-field="primary_units" value="'+(r.primary_units??0)+'"></td><td><input type="number" step="1" data-type="sales" data-id="'+r.id+'" data-field="secondary_units" value="'+(r.secondary_units??0)+'"></td></tr>'});html+='</tbody></table></div>';document.getElementById('productArea').innerHTML=html;document.getElementById('saveArea').classList.remove('hidden')}
async function loadTargets(){const m=+month.value,y=+year.value,h=hq.value;if(!m||!y||!h){showMessage('Please select Month, Year and HQ.','error');return}setLoading(true,'Loading target sheet...');try{const{data:rows,error:te}=await client.from('targets').select('id,product_id,target_pts,target_units,target_value').eq('month',m).eq('year',y).eq('hq_id',h);if(te)throw te;const{data:prods,error:pe}=await client.from('products').select('id,product_name').eq('active',true).order('product_name');if(pe)throw pe;activeProducts=prods||[];targetRows=rows||[];renderTargets()}catch(e){document.getElementById('productArea').innerHTML='<div class="message error" style="display:block">'+escapeHTML(e.message)+'</div>'}finally{setLoading(false)}}
function renderTargets(){const map={};targetRows.forEach(r=>map[r.product_id]=r);let html='<div class="info">Edit PTS, Target Units and Target Value. Blank rows will not be saved.</div><div class="table-container"><table><thead><tr><th>#</th><th>Product</th><th>PTS</th><th>Target Units</th><th>Target Value</th></tr></thead><tbody>';activeProducts.forEach((p,i)=>{const r=map[p.id]||{};html+='<tr><td>'+(i+1)+'</td><td class="product-name">'+escapeHTML(p.product_name)+'</td><td><input type="number" step="0.01" min="0" data-type="target" data-product="'+p.id+'" data-field="target_pts" value="'+(r.target_pts??'')+'"></td><td><input type="number" step="1" min="0" data-type="target" data-product="'+p.id+'" data-field="target_units" value="'+(r.target_units??'')+'"></td><td><input type="number" step="0.01" min="0" data-type="target" data-product="'+p.id+'" data-field="target_value" value="'+(r.target_value??'')+'"></td></tr>'});html+='</tbody></table></div>';document.getElementById('productArea').innerHTML=html;document.getElementById('saveArea').classList.remove('hidden')}
async function saveCurrentData(){mode==='sales'?await saveSales():await saveTargets()}
async function saveSales(){if(!currentHeader)return;const b=document.getElementById('saveButton');b.disabled=true;b.textContent='SAVING...';try{const inputs=[...document.querySelectorAll('[data-type="sales"]')];const updates={};inputs.forEach(i=>{const id=i.dataset.id;if(!updates[id])updates[id]={id};updates[id][i.dataset.field]=i.value===''?null:(i.dataset.field==='pts'?parseFloat(i.value):parseInt(i.value))});for(const u of Object.values(updates)){const{id,...payload}=u;const{error}=await client.from('sales_entry_details').update(payload).eq('id',id).eq('entry_id',currentHeader.id);if(error)throw error}showMessage('Submitted sales updated successfully.','success');await loadSales()}catch(e){showMessage('Unable to update submitted sales: '+e.message,'error')}finally{b.disabled=false;b.textContent='SAVE CHANGES'}}
async function saveTargets(){const m=+month.value,y=+year.value,h=hq.value;if(!m||!y||!h){showMessage('Please select Month, Year and HQ.','error');return}const b=document.getElementById('saveButton');b.disabled=true;b.textContent='SAVING...';try{const rows=[];const grouped={};document.querySelectorAll('[data-type="target"]').forEach(i=>{const p=i.dataset.product;if(!grouped[p])grouped[p]={month:m,year:y,hq_id:h,product_id:p};if(i.value!=='')grouped[p][i.dataset.field]=i.dataset.field==='target_units'?parseInt(i.value):parseFloat(i.value)});Object.values(grouped).forEach(r=>{if(r.target_pts!==undefined||r.target_units!==undefined||r.target_value!==undefined){if(r.target_pts===undefined||r.target_units===undefined){throw new Error('Enter both PTS and Target Units for every used product.')}rows.push(r)}});const{error:de}=await client.from('targets').delete().eq('month',m).eq('year',y).eq('hq_id',h);if(de)throw de;if(rows.length){const{error:ie}=await client.from('targets').insert(rows);if(ie)throw ie}showMessage('Target sheet updated successfully.','success');await loadTargets()}catch(e){showMessage('Unable to update target sheet: '+e.message,'error')}finally{b.disabled=false;b.textContent='SAVE CHANGES'}}
function setLoading(on,text){const b=document.getElementById('loadButton');b.disabled=on;if(on){b.textContent=text}else b.textContent=mode==='sales'?'LOAD SUBMITTED SALES':'LOAD TARGET SHEET'}function showMessage(t,type){const m=document.getElementById('message');m.textContent=t;m.className='message '+type;m.style.display='block'}function escapeHTML(t){const d=document.createElement('div');d.textContent=t??'';return d.innerHTML}function goHome(){location.href='home.html'}initializePage();
</script>
</body>
</html>
