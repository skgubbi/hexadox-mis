<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="cache-version" content="20260903-6"><title>Hexadox MIS - Edit Submitted Data</title><link rel="stylesheet" href="theme-yellow.css?v=20260903-6"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f6;color:#222}.header{background:#f4c400;color:#111;padding:18px 25px;display:flex;justify-content:space-between;align-items:center}.header h2{margin:0;font-size:22px}.btn{border:0;padding:10px 18px;border-radius:6px;cursor:pointer;font-weight:bold;background:#f4c400;color:#111}.btn:disabled{opacity:.6;cursor:not-allowed}.back{background:#fff}.container{max-width:1450px;margin:25px auto;padding:0 15px}.card{background:#fff;padding:22px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:20px}.toggle{display:flex;gap:10px;margin-bottom:20px}.toggle .btn{background:#fff;border:1px solid #d0a900}.toggle .active{background:#f4c400}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}label{display:block;font-weight:bold;margin-bottom:7px}select,input{width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;font-size:15px}select:disabled{background:#eee}.info{background:#fff8d6;border-left:5px solid #f4c400;padding:12px 15px;margin-bottom:18px}.table-container{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:1150px}th{background:#f4c400;color:#111;padding:11px 8px;text-align:center}td{padding:8px;border-bottom:1px solid #ddd;text-align:center}td.product{text-align:left;font-weight:500}.value{font-weight:bold;text-align:right}.message{margin-top:15px;padding:12px;border-radius:5px;text-align:center;font-weight:bold}.success{background:#d9f5e9;color:#146c43}.error{background:#f8d7da;color:#842029}.loading{text-align:center;padding:25px;font-weight:bold}.hidden{display:none!important}.changed{background:#fff3bf!important;border-color:#d0a900!important}.addbar{display:flex;gap:10px;align-items:center;margin-bottom:15px}.addbar select{max-width:450px}.remove{background:#f8d7da;color:#842029;border:1px solid #e3a6ad;padding:7px 10px;border-radius:5px;cursor:pointer}.newrow{background:#fffdf0}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid{grid-template-columns:1fr}.toggle{flex-direction:column}.addbar{flex-direction:column;align-items:stretch}.addbar select{max-width:none}.header h2{font-size:18px}}</style></head><body><div class="header"><h2>HEXADOX MIS — EDIT SUBMITTED DATA</h2><button class="btn back" onclick="goHome()">HOME</button></div><div class="container"><div class="card"><h3>Edit Existing Data</h3><div class="toggle"><button id="salesMode" class="btn active" onclick="setMode('sales')">EDIT SUBMITTED SALES</button><button id="targetMode" class="btn" onclick="setMode('targets')">EDIT TARGET SHEET</button></div><div id="salesInfo" class="info">For submitted sales, select Month, Year, HQ and Stockist.</div><div id="targetInfo" class="info hidden">For target sheets, select Month, Year and HQ. Stockist is not required.</div><div class="grid"><div><label>Month</label><select id="month"><option value="">Select Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select></div><div><label>Year</label><select id="year"><option value="">Select Year</option></select></div><div><label>HQ</label><select id="hq"><option value="">Loading HQ...</option></select></div><div id="stockistBox"><label>Stockist</label><select id="stockist" disabled><option value="">Select Stockist</option></select></div></div><div style="text-align:center;margin-top:22px"><button id="loadButton" class="btn" onclick="loadCurrentData()">LOAD SUBMITTED SALES</button></div></div><div class="card"><h3 id="resultTitle">Submitted Product Data</h3><div id="productArea"><div class="loading">Select the filters and click LOAD.</div></div><div id="saveArea" class="hidden" style="text-align:center;margin-top:25px"><button id="saveButton" class="btn" onclick="saveCurrentData()">SAVE CHANGES</button></div></div><div id="message" class="message hidden"></div></div><script>
const URL='https://euyqvisqgxuwzcswwiqf.supabase.co',KEY='sb_publishable_4YiBchy04wWSH4K74uXNiw_F0TUILqF';let client=null,mode='sales',currentHeader=null,salesDetails=[],activeProducts=[],targetRows=[];const $=id=>document.getElementById(id);function loadScript(src){return new Promise((res,rej)=>{let s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}async function init(){if(!window.supabase?.createClient){try{await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2')}catch(e){await loadScript('https://unpkg.com/@supabase/supabase-js@2')}}if(!window.supabase?.createClient)throw Error('Supabase library could not be loaded.');client=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});let{data,error}=await client.auth.getSession();if(error)throw error;if(!data.session){location.href='index.html';return}loadYears();let d=new Date();$('month').value=d.getMonth()+1;$('year').value=d.getFullYear();await loadHQs()}function loadYears(){let s=$('year'),y=new Date().getFullYear();for(let n=y-2;n<=y+1;n++)s.appendChild(new Option(n,n))}async function loadHQs(){let{data,error}=await client.from('hqs').select('id,hq_name').eq('active',true).order('hq_name');if(error)throw error;$('hq').innerHTML='<option value="">Select HQ</option>';(data||[]).forEach(x=>$('hq').appendChild(new Option(x.hq_name,x.id)))}$('hq').addEventListener('change',()=>{if(mode==='sales')loadStockists()});async function loadStockists(){let h=$('hq').value,s=$('stockist');s.disabled=true;if(!h){s.innerHTML='<option value="">Select Stockist</option>';return}s.innerHTML='<option>Loading Stockists...</option>';let{data,error}=await client.from('stockists').select('id,stockist_name').eq('hq_id',h).eq('active',true).order('stockist_name');if(error){msg('Unable to load stockists: '+error.message,'error');return}s.innerHTML='<option value="">Select Stockist</option>' ;(data||[]).forEach(x=>s.appendChild(new Option(x.stockist_name,x.id)));s.disabled=false}function setMode(m){mode=m;$('salesMode').classList.toggle('active',m==='sales');$('targetMode').classList.toggle('active',m==='targets');$('salesInfo').classList.toggle('hidden',m!=='sales');$('targetInfo').classList.toggle('hidden',m!=='targets');$('stockistBox').classList.toggle('hidden',m==='targets');$('loadButton').textContent=m==='sales'?'LOAD SUBMITTED SALES':'LOAD TARGET SHEET';$('resultTitle').textContent=m==='sales'?'Submitted Product Data':'Submitted Target Sheet';$('productArea').innerHTML='<div class="loading">Select the filters and click LOAD.</div>';$('saveArea').classList.add('hidden');if(m==='sales')loadStockists()}function msg(t,type){let m=$('message');m.textContent=t;m.className='message '+type;m.classList.remove('hidden')}function loading(on,t){$('loadButton').disabled=on;if(on)$('loadButton').textContent=t;else $('loadButton').textContent=mode==='sales'?'LOAD SUBMITTED SALES':'LOAD TARGET SHEET'}function esc(t){let d=document.createElement('div');d.textContent=t??'';return d.innerHTML}function money(v){return Number(v||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}function goHome(){location.href='home.html?v=20260903-6'}async function loadCurrentData(){mode==='sales'?await loadSales():await loadTargets()}async function loadSales(){let m=+$('month').value,y=+$('year').value,h=$('hq').value,s=$('stockist').value;if(!m||!y||!h||!s){msg('Please select Month, Year, HQ and Stockist.','error');return}loading(true,'Loading submitted sales...');try{let{data,error}=await client.from('sales_entry_header').select('id,stockist_id,hq_id,month,year').eq('stockist_id',s).eq('hq_id',h).eq('month',m).eq('year',y).limit(1);if(error)throw error;if(!data?.length)throw Error('No submitted sales found for this Month, Year, HQ and Stockist.');currentHeader=data[0];let{data:rows,error:de}=await client.from('sales_entry_details').select('id,product_id,pts,primary_pts,secondary_pts,primary_units,secondary_units,products(product_name)').eq('entry_id',currentHeader.id).order('id');if(de)throw de;salesDetails=(rows||[]).filter(r=>Number(r.primary_units)||Number(r.secondary_units)||Number(r.primary_pts??r.pts)||Number(r.secondary_pts??r.pts));let{data:prods,error:pe}=await client.from('products').select('id,product_name').eq('active',true).order('product_name');if(pe)throw pe;activeProducts=prods||[];renderSales()}catch(e){$('productArea').innerHTML='<div class="message error" style="display:block">'+esc(e.message)+'</div>'}finally{loading(false)}}function renderSales(){let h='<div class="info"><b>Primary PTS and Secondary PTS are independent.</b><br>Primary Value = Primary PTS × Primary Units. Secondary Value = Secondary PTS × Secondary Units.</div><div class="addbar"><select id="addProduct"><option value="">Select brand/product to add</option>';let used=new Set(salesDetails.map(r=>String(r.product_id)));activeProducts.filter(p=>!used.has(String(p.id))).forEach(p=>h+='<option value="'+p.id+'">'+esc(p.product_name)+'</option>');h+='</select><button class="btn" type="button" onclick="addProduct()">+ ADD BRAND</button></div><div class="table-container"><table><thead><tr><th>#</th><th>Product</th><th>Primary PTS</th><th>Primary Units</th><th>Primary Value</th><th>Secondary PTS</th><th>Secondary Units</th><th>Secondary Value</th><th>Action</th></tr></thead><tbody>';salesDetails.forEach((r,i)=>{let id=r.id||'new_'+r.product_id,pp=Number(r.primary_pts??r.pts)||0,sp=Number(r.secondary_pts??r.pts)||0;h+='<tr class="'+(r.id?'':'newrow')+'" data-id="'+id+'" data-product="'+r.product_id+'"><td>'+(i+1)+'</td><td class="product">'+esc(r.products?.product_name||'')+'</td><td><input type="number" min="0" step="0.01" data-f="primary_pts" value="'+pp+'"></td><td><input type="number" min="0" step="1" data-f="primary_units" value="'+(r.primary_units??0)+'"></td><td class="value pv">'+money(pp*(Number(r.primary_units)||0))+'</td><td><input type="number" min="0" step="0.01" data-f="secondary_pts" value="'+sp+'"></td><td><input type="number" min="0" step="1" data-f="secondary_units" value="'+(r.secondary_units??0)+'"></td><td class="value sv">'+money(sp*(Number(r.secondary_units)||0))+'</td><td><button class="remove" type="button" onclick="removeProduct(\''+id+'\')">REMOVE</button></td></tr>'});h+='</tbody></table></div>';$('productArea').innerHTML=h;$('saveArea').classList.remove('hidden');document.querySelectorAll('#productArea tr[data-id] input').forEach(inp=>inp.addEventListener('input',()=>{let r=inp.closest('tr'),pp=+r.querySelector('[data-f="primary_pts"]').value||0,pu=+r.querySelector('[data-f="primary_units"]').value||0,sp=+r.querySelector('[data-f="secondary_pts"]').value||0,su=+r.querySelector('[data-f="secondary_units"]').value||0;r.querySelector('.pv').textContent=money(pp*pu);r.querySelector('.sv').textContent=money(sp*su);inp.classList.add('changed')}))}function addProduct(){let id=$('addProduct').value;if(!id){msg('Please select a brand/product to add.','error');return}let p=activeProducts.find(x=>String(x.id)===String(id));if(!p)return;salesDetails.push({id:null,product_id:p.id,pts:0,primary_pts:0,secondary_pts:0,primary_units:0,secondary_units:0,products:{product_name:p.product_name}});renderSales();msg(p.product_name+' added. Enter values, then SAVE CHANGES.','success')}function removeProduct(id){if(!confirm('Remove this product from the submitted entry?'))return;salesDetails=salesDetails.filter(r=>String(r.id||'new_'+r.product_id)!==String(id));renderSales();msg('Product marked for removal. Click SAVE CHANGES.','success')}async function saveCurrentData(){if(mode==='sales')await saveSales();else await saveTargets()}async function saveSales(){if(!currentHeader){msg('Please load submitted sales first.','error');return}let b=$('saveButton');b.disabled=true;b.textContent='SAVING...';msg('SAVING TO DATABASE...','success');try{let desired=[];document.querySelectorAll('#productArea tr[data-id]').forEach(tr=>{let g=f=>tr.querySelector('[data-f="'+f+'"]');let pp=Number(g('primary_pts').value)||0,sp=Number(g('secondary_pts').value)||0,pu=Number(g('primary_units').value),su=Number(g('secondary_units').value);if(!Number.isInteger(pu)||!Number.isInteger(su)||pu<0||su<0||pp<0||sp<0)throw Error('Invalid values for '+tr.querySelector('.product').textContent);desired.push({id:tr.dataset.id,product_id:tr.dataset.product,pp,sp,pu,su})});let keep=new Set();for(let r of desired){let payload={pts:r.pp,primary_pts:r.pp,secondary_pts:r.sp,primary_units:r.pu,secondary_units:r.su,primary_value:r.pp*r.pu,secondary_value:r.sp*r.su};if(r.id.startsWith('new_')){let{data,error}=await client.from('sales_entry_details').insert({entry_id:currentHeader.id,product_id:r.product_id,...payload}).select('id');if(error)throw error;if(!data?.length)throw Error('New product was not created.');keep.add(String(data[0].id))}else{let{error}=await client.from('sales_entry_details').update(payload).eq('id',r.id).eq('entry_id',currentHeader.id);if(error)throw error;keep.add(String(r.id))}}let{data:old,error:oe}=await client.from('sales_entry_details').select('id').eq('entry_id',currentHeader.id);if(oe)throw oe;for(let r of old||[]){if(!keep.has(String(r.id))){let{error}=await client.from('sales_entry_details').delete().eq('id',r.id).eq('entry_id',currentHeader.id);if(error)throw error}}let{data:verify,error:ve}=await client.from('sales_entry_details').select('id,primary_pts,secondary_pts,primary_units,secondary_units').eq('entry_id',currentHeader.id);if(ve)throw ve;if((verify||[]).length!==desired.length)throw Error('Save verification failed: database row count did not match.');msg('SAVED SUCCESSFULLY.','success');await loadSales()}catch(e){msg('SAVE FAILED: '+(e.message||e),'error')}finally{b.disabled=false;b.textContent='SAVE CHANGES'}}async function loadTargets(){let m=+$('month').value,y=+$('year').value,h=$('hq').value;if(!m||!y||!h){msg('Please select Month, Year and HQ.','error');return}loading(true,'Loading target sheet...');try{let{data:prods,error:pe}=await client.from('products').select('id,product_name').eq('active',true).order('product_name');if(pe)throw pe;activeProducts=prods||[];let{data:rows,error:te}=await client.from('targets').select('id,product_id,target_units').eq('month',m).eq('year',y).eq('hq_id',h);if(te)throw te;targetRows=rows||[];let map={};targetRows.forEach(r=>map[r.product_id]=r);let h='<div class="info">Edit Target Units and press SAVE CHANGES.</div><div class="table-container"><table><thead><tr><th>#</th><th>Product</th><th>Target Units</th></tr></thead><tbody>';activeProducts.forEach((p,i)=>h+='<tr><td>'+(i+1)+'</td><td class="product">'+esc(p.product_name)+'</td><td><input type="number" min="0" step="1" class="target-unit" data-product="'+p.id+'" value="'+(map[p.id]?.target_units??'')+'"></td></tr>');h+='</tbody></table></div>';$('productArea').innerHTML=h;$('saveArea').classList.remove('hidden')}catch(e){msg('LOAD FAILED: '+e.message,'error')}finally{loading(false)}}async function saveTargets(){let m=+$('month').value,y=+$('year').value,h=$('hq').value;if(!m||!y||!h){msg('Please select Month, Year and HQ.','error');return}let b=$('saveButton');b.disabled=true;b.textContent='SAVING...';try{let desired=[];for(let p of activeProducts){let el=document.querySelector('.target-unit[data-product="'+p.id+'"]');if(el?.value.trim()){let u=parseInt(el.value,10);if(!Number.isInteger(u)||u<0)throw Error('Invalid Target Units for '+p.product_name);desired.push({product_id:p.id,target_units:u})}}for(let r of desired){let{data:ex,error:qe}=await client.from('targets').select('id').eq('month',m).eq('year',y).eq('hq_id',h).eq('product_id',r.product_id).limit(1);if(qe)throw qe;if(ex?.length){let{error}=await client.from('targets').update({target_units:r.target_units}).eq('id',ex[0].id);if(error)throw error}else{let{error}=await client.from('targets').insert({month:m,year:y,hq_id:h,product_id:r.product_id,target_units:r.target_units});if(error)throw error}}msg('TARGETS SAVED SUCCESSFULLY.','success');await loadTargets()}catch(e){msg('SAVE FAILED: '+e.message,'error')}finally{b.disabled=false;b.textContent='SAVE CHANGES'}}init().catch(e=>msg('INITIALIZATION FAILED: '+e.message,'error'));
</script></body></html>
