<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="cache-version" content="20260903-8"><title>Hexadox MIS - Edit Submitted Data</title>
<link rel="stylesheet" href="theme-yellow.css?v=20260903-8">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f6;color:#222}.header{background:#f4c400;color:#111;padding:18px 25px;display:flex;justify-content:space-between;align-items:center}.header h2{margin:0;font-size:22px}.btn{border:0;padding:10px 18px;border-radius:6px;cursor:pointer;font-weight:bold;background:#f4c400;color:#111}.btn:disabled{opacity:.6}.back{background:#fff}.container{max-width:1450px;margin:25px auto;padding:0 15px}.card{background:#fff;padding:22px;border-radius:10px;box-shadow:0 2px 10px #00000014;margin-bottom:20px}.toggle{display:flex;gap:10px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}label{display:block;font-weight:bold;margin-bottom:7px}select,input{width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;font-size:15px}.info{background:#fff8d6;border-left:5px solid #f4c400;padding:12px 15px;margin-bottom:18px}.table-container{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:1150px}th{background:#f4c400;padding:11px 8px;text-align:center}td{padding:8px;border-bottom:1px solid #ddd;text-align:center}td.product{text-align:left;font-weight:500}.value{font-weight:bold;text-align:right}.message{margin-top:15px;padding:12px;border-radius:5px;text-align:center;font-weight:bold}.success{background:#d9f5e9;color:#146c43}.error{background:#f8d7da;color:#842029}.loading{text-align:center;padding:25px;font-weight:bold}.hidden{display:none!important}.changed{background:#fff3bf!important}.addbar{display:flex;gap:10px;margin-bottom:15px}.addbar select{max-width:450px}.remove{background:#f8d7da;color:#842029;border:1px solid #e3a6ad;padding:7px 10px;border-radius:5px;cursor:pointer}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid{grid-template-columns:1fr}.toggle,.addbar{flex-direction:column}.header h2{font-size:18px}}
</style></head>
<body>
<div class="header"><h2>HEXADOX MIS — EDIT SUBMITTED DATA</h2><button class="btn back" onclick="goHome()">HOME</button></div>
<div class="container">
<div class="card"><h3>Edit Existing Data</h3>
<div class="toggle"><button id="salesMode" class="btn" onclick="setMode('sales')">EDIT SUBMITTED SALES</button><button id="targetMode" class="btn" onclick="setMode('targets')">EDIT TARGET SHEET</button></div>
<div id="salesInfo" class="info">For submitted sales, select Month, Year, HQ and Stockist.</div><div id="targetInfo" class="info hidden">Target-sheet editing is temporarily disabled while submitted-sales editing is being verified.</div>
<div class="grid"><div><label>Month</label><select id="month"><option value="">Select Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select></div>
<div><label>Year</label><select id="year"><option value="">Select Year</option></select></div><div><label>HQ</label><select id="hq"><option value="">Loading HQ...</option></select></div><div id="stockistBox"><label>Stockist</label><select id="stockist" disabled><option value="">Select Stockist</option></select></div></div>
<div style="text-align:center;margin-top:22px"><button id="loadButton" class="btn" onclick="loadCurrentData()">LOAD SUBMITTED SALES</button></div></div>
<div class="card"><h3 id="resultTitle">Submitted Product Data</h3><div id="productArea"><div class="loading">Select the filters and click LOAD.</div></div><div id="saveArea" class="hidden" style="text-align:center;margin-top:25px"><button id="saveButton" class="btn" onclick="saveCurrentData()">SAVE CHANGES</button></div></div>
<div id="message" class="message hidden"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://euyqvisqgxuwzcswwiqf.supabase.co';
const SUPABASE_KEY='sb_publishable_4YiBchy04wWSH4K74uXNiw_F0TUILqF';
let client,mode='sales',header=null,sales=[],products=[];
const $=id=>document.getElementById(id);
const esc=x=>{const d=document.createElement('div');d.textContent=x??'';return d.innerHTML};
const money=x=>Number(x||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function msg(t,c){const e=$('message');e.textContent=t;e.className='message '+c;e.classList.remove('hidden')}
function goHome(){location.href='home.html?v=20260903-8'}
function years(){const s=$('year'),y=new Date().getFullYear();for(let n=y-2;n<=y+1;n++)s.appendChild(new Option(n,n))}
async function init(){client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const q=await client.auth.getSession();if(q.error)throw q.error;if(!q.data.session){location.href='index.html';return}years();const d=new Date();$('month').value=d.getMonth()+1;$('year').value=d.getFullYear();await hqs();setMode('sales')}
async function hqs(){const q=await client.from('hqs').select('id,hq_name').eq('active',true).order('hq_name');if(q.error)throw q.error;$('hq').innerHTML='<option value="">Select HQ</option>';(q.data||[]).forEach(x=>$('hq').appendChild(new Option(x.hq_name,x.id)))}
async function stockists(){const h=$('hq').value,s=$('stockist');s.disabled=true;if(!h){s.innerHTML='<option value="">Select Stockist</option>';return}s.innerHTML='<option>Loading Stockists...</option>';const q=await client.from('stockists').select('id,stockist_name').eq('hq_id',h).eq('active',true).order('stockist_name');if(q.error){msg(q.error.message,'error');return}s.innerHTML='<option value="">Select Stockist</option>';(q.data||[]).forEach(x=>s.appendChild(new Option(x.stockist_name,x.id)));s.disabled=false}
$('hq').addEventListener('change',stockists);
function setMode(m){mode=m;$('salesMode').classList.toggle('active',m==='sales');$('targetMode').classList.toggle('active',m==='targets');$('salesInfo').classList.toggle('hidden',m!=='sales');$('targetInfo').classList.toggle('hidden',m!=='targets');$('stockistBox').classList.toggle('hidden',m==='targets');$('loadButton').textContent=m==='sales'?'LOAD SUBMITTED SALES':'LOAD TARGET SHEET';$('resultTitle').textContent=m==='sales'?'Submitted Product Data':'Submitted Target Sheet';$('productArea').innerHTML='<div class="loading">Select the filters and click LOAD.</div>';$('saveArea').classList.add('hidden');if(m==='sales')stockists()}
function loadCurrentData(){if(mode==='sales')return loadSales();return loadTargets()}
async function loadSales(){const m=+$('month').value,y=+$('year').value,h=$('hq').value,s=$('stockist').value;if(!m||!y||!h||!s){msg('Please select Month, Year, HQ and Stockist.','error');return}$('loadButton').disabled=true;$('loadButton').textContent='LOADING...';try{let q=await client.from('sales_entry_header').select('id,stockist_id,hq_id,month,year').eq('stockist_id',s).eq('hq_id',h).eq('month',m).eq('year',y).limit(1);if(q.error)throw q.error;if(!q.data?.length)throw Error('No submitted sales found.');header=q.data[0];q=await client.from('sales_entry_details').select('id,product_id,pts,primary_pts,secondary_pts,primary_units,secondary_units,products(product_name)').eq('entry_id',header.id).order('id');if(q.error)throw q.error;sales=(q.data||[]).filter(r=>Number(r.primary_units)||Number(r.secondary_units)||Number(r.primary_pts??r.pts)||Number(r.secondary_pts??r.pts));q=await client.from('products').select('id,product_name').eq('active',true).order('product_name');if(q.error)throw q.error;products=q.data||[];renderSales()}catch(e){msg('LOAD FAILED: '+e.message,'error')}finally{$('loadButton').disabled=false;$('loadButton').textContent='LOAD SUBMITTED SALES'}}
function renderSales(){let h='<div class="info"><b>Primary PTS and Secondary PTS are independent.</b><br>Primary Value = Primary PTS × Primary Units. Secondary Value = Secondary PTS × Secondary Units.</div><div class="addbar"><select id="addProduct"><option value="">Select brand/product to add</option>';const used=new Set(sales.map(r=>String(r.product_id)));products.filter(p=>!used.has(String(p.id))).forEach(p=>h+='<option value="'+p.id+'">'+esc(p.product_name)+'</option>');h+='</select><button class="btn" onclick="addProduct()">+ ADD BRAND</button></div><div class="table-container"><table><thead><tr><th>#</th><th>Product</th><th>Primary PTS</th><th>Primary Units</th><th>Primary Value</th><th>Secondary PTS</th><th>Secondary Units</th><th>Secondary Value</th><th>Action</th></tr></thead><tbody>';
sales.forEach((r,i)=>{const id=String(r.id||'new_'+r.product_id),pp=Number(r.primary_pts??r.pts)||0,sp=Number(r.secondary_pts??r.pts)||0,pu=Number(r.primary_units)||0,su=Number(r.secondary_units)||0;h+='<tr data-id="'+id+'" data-product="'+r.product_id+'"><td>'+(i+1)+'</td><td class="product">'+esc(r.products?.product_name||'')+'</td><td><input type="number" min="0" step="0.01" data-f="pp" value="'+pp+'"></td><td><input type="number" min="0" step="1" data-f="pu" value="'+pu+'"></td><td class="value pv">'+money(pp*pu)+'</td><td><input type="number" min="0" step="0.01" data-f="sp" value="'+sp+'"></td><td><input type="number" min="0" step="1" data-f="su" value="'+su+'"></td><td class="value sv">'+money(sp*su)+'</td><td><button class="remove" onclick="removeProduct(\''+id+'\')">REMOVE</button></td></tr>'});h+='</tbody></table></div>';$('productArea').innerHTML=h;$('saveArea').classList.remove('hidden');document.querySelectorAll('#productArea tr[data-id] input').forEach(i=>i.addEventListener('input',()=>{const r=i.closest('tr'),pp=+r.querySelector('[data-f="pp"]').value||0,pu=+r.querySelector('[data-f="pu"]').value||0,sp=+r.querySelector('[data-f="sp"]').value||0,su=+r.querySelector('[data-f="su"]').value||0;r.querySelector('.pv').textContent=money(pp*pu);r.querySelector('.sv').textContent=money(sp*su);i.classList.add('changed')}))}
function addProduct(){const id=$('addProduct').value;if(!id){msg('Select a product first.','error');return}const p=products.find(x=>String(x.id)===String(id));sales.push({id:null,product_id:p.id,pts:0,primary_pts:0,secondary_pts:0,primary_units:0,secondary_units:0,products:{product_name:p.product_name}});renderSales();msg(p.product_name+' added. Enter values and SAVE CHANGES.','success')}
function removeProduct(id){if(!confirm('Remove this product from the submission?'))return;sales=sales.filter(r=>String(r.id||'new_'+r.product_id)!==String(id));renderSales();msg('Product marked for removal. Click SAVE CHANGES.','success')}
async function saveCurrentData(){if(mode==='sales')return saveSales();msg('Target-sheet editing is temporarily disabled while we finish the sales save fix.','error')}
async function saveSales(){if(!header){msg('Load a submitted entry first.','error');return}const b=$('saveButton');b.disabled=true;b.textContent='SAVING...';msg('SAVING TO DATABASE...','success');try{const desired=[];document.querySelectorAll('#productArea tr[data-id]').forEach(tr=>{const g=f=>tr.querySelector('[data-f="'+f+'"]'),pp=Number(g('pp').value),sp=Number(g('sp').value),pu=Number(g('pu').value),su=Number(g('su').value);if(!Number.isFinite(pp)||!Number.isFinite(sp)||!Number.isInteger(pu)||!Number.isInteger(su)||pp<0||sp<0||pu<0||su<0)throw Error('Invalid values for '+tr.querySelector('.product').textContent);desired.push({id:tr.dataset.id,product_id:tr.dataset.product,pp,sp,pu,su})});const keep=new Set();for(const r of desired){
// primary_value and secondary_value are GENERATED columns in Supabase. Do not send them.
// They are calculated by the database from primary_pts/secondary_pts and units.
const payload={pts:r.pp,primary_pts:r.pp,secondary_pts:r.sp,primary_units:r.pu,secondary_units:r.su};
if(r.id.startsWith('new_')){const q=await client.from('sales_entry_details').insert({entry_id:header.id,product_id:r.product_id,...payload}).select('id');if(q.error)throw q.error;if(!q.data?.length)throw Error('Insert did not return a row.');keep.add(String(q.data[0].id))}else{const q=await client.from('sales_entry_details').update(payload).eq('id',r.id).eq('entry_id',header.id);if(q.error)throw q.error;keep.add(String(r.id))}}
let q=await client.from('sales_entry_details').select('id').eq('entry_id',header.id);if(q.error)throw q.error;for(const old of q.data||[]){if(!keep.has(String(old.id))){const d=await client.from('sales_entry_details').delete().eq('id',old.id).eq('entry_id',header.id);if(d.error)throw d.error}}
const v=await client.from('sales_entry_details').select('id,pts,primary_pts,secondary_pts,primary_units,secondary_units,primary_value,secondary_value').eq('entry_id',header.id);if(v.error)throw v.error;if((v.data||[]).length!==desired.length)throw Error('Verification failed: saved row count is different.');for(const r of desired){const row=(v.data||[]).find(x=>String(x.id)===String(r.id));if(row){if(Number(row.primary_pts)!==r.pp||Number(row.secondary_pts)!==r.sp||Number(row.primary_units)!==r.pu||Number(row.secondary_units)!==r.su)throw Error('Verification failed: saved values do not match.')}}msg('SAVED SUCCESSFULLY.','success');await loadSales()}catch(e){msg('SAVE FAILED: '+(e.message||e),'error')}finally{b.disabled=false;b.textContent='SAVE CHANGES'}}
function loadTargets(){msg('Target-sheet editing will be restored after sales editing is confirmed.','error')}
init().catch(e=>msg('INITIALIZATION FAILED: '+e.message,'error'));
</script></body></html>
