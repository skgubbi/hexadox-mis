<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hexadox MIS - Edit Submitted Data</title>
<link rel="stylesheet" href="theme-yellow.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f6;color:#222}.header{background:#f4c400;color:#111;padding:18px 25px;display:flex;justify-content:space-between;align-items:center}.header h2{margin:0;font-size:22px}.btn{border:0;padding:10px 18px;border-radius:6px;cursor:pointer;font-weight:bold;background:#f4c400;color:#111}.btn:disabled{opacity:.6;cursor:not-allowed}.back{background:#fff}.container{max-width:1400px;margin:25px auto;padding:0 15px}.card{background:#fff;padding:22px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin:0 0 20px}.toggle{display:flex;gap:10px;margin-bottom:20px}.toggle .btn{background:#fff;border:1px solid #d0a900}.toggle .active{background:#f4c400}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}label{display:block;font-weight:bold;margin-bottom:7px}select,input{width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;font-size:15px}select:disabled{background:#eee}.info{background:#fff8d6;border-left:5px solid #f4c400;padding:12px 15px;margin-bottom:18px}.table-container{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:1250px}th{background:#f4c400;color:#111;padding:11px 8px;text-align:center}td{padding:8px;border-bottom:1px solid #ddd;text-align:center}td.product{text-align:left;font-weight:500}td input{width:115px;text-align:right}.value{font-weight:bold;text-align:right}.message{margin-top:15px;padding:12px;border-radius:5px;display:none;text-align:center;font-weight:bold}.success{background:#d9f5e9;color:#146c43}.error{background:#f8d7da;color:#842029}.loading{text-align:center;padding:25px;font-weight:bold}.hidden{display:none!important}.changed{background:#fff3bf!important;border-color:#d0a900!important}.add-product-bar{display:flex;gap:10px;align-items:center;margin:0 0 15px}.add-product-bar select{max-width:420px}.remove-btn{background:#f8d7da;color:#842029;border:1px solid #e3a6ad;padding:7px 10px;border-radius:5px;cursor:pointer;font-weight:bold}.remove-btn:hover{background:#f1c2c7}.new-row{background:#fffdf0}.pts-input{width:110px!important}.units-input{width:105px!important}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid{grid-template-columns:1fr}.toggle{flex-direction:column}.header h2{font-size:18px}.add-product-bar{flex-direction:column;align-items:stretch}.add-product-bar select{max-width:none}}
</style>
</head>
<body>
<div class="header"><h2>HEXADOX MIS — EDIT SUBMITTED DATA</h2><button class="btn back" onclick="editV2GoHome()">HOME</button></div>
<div class="container">
<div class="card">
<h3>Edit Existing Data</h3>
<div class="toggle"><button id="salesMode" class="btn active" onclick="editV2SetMode('sales')">EDIT SUBMITTED SALES</button><button id="targetMode" class="btn" onclick="editV2SetMode('targets')">EDIT TARGET SHEET</button></div>
<div id="salesInfo" class="info">For submitted sales, select Month, Year, HQ and Stockist.</div>
<div id="targetInfo" class="info hidden">For target sheets, select Month, Year and HQ. Stockist is not required.</div>
<div class="grid">
<div><label>Month</label><select id="month"><option value="">Select Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select></div>
<div><label>Year</label><select id="year"><option value="">Select Year</option></select></div>
<div><label>HQ</label><select id="hq"><option value="">Loading HQ...</option></select></div>
<div id="stockistBox"><label>Stockist</label><select id="stockist" disabled><option value="">Select Stockist</option></select></div>
</div>
<div style="text-align:center;margin-top:22px"><button id="loadButton" class="btn" onclick="editV2LoadCurrentData()">LOAD SUBMITTED SALES</button></div>
</div>
<div class="card"><h3 id="resultTitle">Submitted Product Data</h3><div id="productArea"><div class="loading">Select the entry and click LOAD.</div></div><div id="saveArea" class="hidden" style="text-align:center;margin-top:25px"><button id="saveButton" class="btn" onclick="editV2SaveCurrentData()">SAVE CHANGES</button></div></div>
<div id="message" class="message"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=20260903-4"></script>
<script>
let editV2Mode='sales',editV2Header=null,editV2Sales=[],editV2Products=[],editV2Targets=[];
const E=id=>document.getElementById(id);
function editV2SetMode(m){editV2Mode=m;E('salesMode').classList.toggle('active',m==='sales');E('targetMode').classList.toggle('active',m==='targets');E('salesInfo').classList.toggle('hidden',m!=='sales');E('targetInfo').classList.toggle('hidden',m!=='targets');E('stockistBox').classList.toggle('hidden',m==='targets');E('loadButton').textContent=m==='sales'?'LOAD SUBMITTED SALES':'LOAD TARGET SHEET';E('resultTitle').textContent=m==='sales'?'Submitted Product Data':'Submitted Target Sheet';E('productArea').innerHTML='<div class="loading">Select the filters and click LOAD.</div>';E('saveArea').classList.add('hidden');if(m==='sales')editV2LoadStockists()}
async function editV2Init(){try{if(!window.client){throw new Error('Supabase client is not available. Please refresh the page.')}const{data,error}=await client.auth.getSession();if(error||!data.session){location.href='index.html';return}editV2LoadYears();const d=new Date();E('month').value=d.getMonth()+1;E('year').value=d.getFullYear();await editV2LoadHQs()}catch(e){editV2ShowMessage(e.message,'error')}}
function editV2LoadYears(){const s=E('year'),y=new Date().getFullYear();for(let n=y-2;n<=y+1;n++)s.appendChild(new Option(n,n))}
async function editV2LoadHQs(){const{data,error}=await client.from('hqs').select('id,hq_name').eq('active',true).order('hq_name');if(error){editV2ShowMessage('Unable to load HQs: '+error.message,'error');return}E('hq').innerHTML='<option value="">Select HQ</option>';(data||[]).forEach(x=>E('hq').appendChild(new Option(x.hq_name,x.id)))}
E('hq').addEventListener('change',()=>{if(editV2Mode==='sales')editV2LoadStockists()});
async function editV2LoadStockists(){const h=E('hq').value,s=E('stockist');s.disabled=true;s.innerHTML='<option value="">Loading Stockists...</option>';if(!h){s.innerHTML='<option value="">Select Stockist</option>';return}const{data,error}=await client.from('stockists').select('id,stockist_name').eq('hq_id',h).eq('active',true).order('stockist_name');if(error){editV2ShowMessage('Unable to load stockists: '+error.message,'error');return}s.innerHTML='<option value="">Select Stockist</option>';(data||[]).forEach(x=>s.appendChild(new Option(x.stockist_name,x.id)));s.disabled=false}
async function editV2LoadCurrentData(){if(editV2Mode==='sales')await editV2LoadSales();else await editV2LoadTargets()}
async function editV2LoadSales(){const m=+E('month').value,y=+E('year').value,h=E('hq').value,s=E('stockist').value;if(!m||!y||!h||!s){editV2ShowMessage('Please select Month, Year, HQ and Stockist.','error');return}editV2SetLoading(true,'Loading submitted sales...');try{const{data:heads,error:he}=await client.from('sales_entry_header').select('id,stockist_id,hq_id,month,year').eq('stockist_id',s).eq('hq_id',h).eq('month',m).eq('year',y).limit(1);if(he)throw he;if(!heads?.length)throw new Error('No submitted sales found for this Month, Year, HQ and Stockist.');editV2Header=heads[0];const{data:rows,error:de}=await client.from('sales_entry_details').select('id,product_id,pts,primary_pts,secondary_pts,primary_units,primary_value,secondary_units,secondary_value,products(product_name)').eq('entry_id',editV2Header.id).order('id');if(de)throw de;editV2Sales=(rows||[]).filter(r=>(Number(r.primary_units)||0)!==0||(Number(r.secondary_units)||0)!==0||(Number(r.primary_pts??r.pts)||0)!==0||(Number(r.secondary_pts??r.pts)||0)!==0).sort((a,b)=>String(a.products?.product_name||'').localeCompare(String(b.products?.product_name||''),undefined,{numeric:true,sensitivity:'base'}));const{data:prods,error:pe}=await client.from('products').select('id,product_name').eq('active',true).order('product_name');if(pe)throw pe;editV2Products=prods||[];editV2RenderSales()}catch(e){E('productArea').innerHTML='<div class="message error" style="display:block">'+editV2Esc(e.message)+'</div>'}finally{editV2SetLoading(false)}}
function editV2RenderSales(){let html='<div class="info">Primary and Secondary PTS are independent. Primary Value = Primary PTS × Primary Units. Secondary Value = Secondary PTS × Secondary Units. Changes are permanent only after SAVE CHANGES.</div><div class="add-product-bar"><select id="addProductSelect"><option value="">Select brand/product to add</option>';const used=new Set(editV2Sales.map(r=>String(r.product_id)));editV2Products.filter(p=>!used.has(String(p.id))).forEach(p=>html+='<option value="'+p.id+'">'+editV2Esc(p.product_name)+'</option>');html+='</select><button class="btn" type="button" onclick="editV2AddProduct()">+ ADD BRAND</button></div><div class="table-container"><table><thead><tr><th>#</th><th>Product</th><th>Primary PTS</th><th>Primary Units</th><th>Primary Value</th><th>Secondary PTS</th><th>Secondary Units</th><th>Secondary Value</th><th>Action</th></tr></thead><tbody>';editV2Sales.forEach((r,i)=>html+=editV2SalesRow(r,i));html+='</tbody></table></div>';E('productArea').innerHTML=html;E('saveArea').classList.remove('hidden');editV2AttachCalc()}
function editV2SalesRow(r,i){const id=r.id||('new_'+r.product_id);const pp=r.primary_pts??r.pts??0,sp=r.secondary_pts??r.pts??0;return '<tr class="'+(r.id?'':'new-row')+'" data-row-id="'+id+'" data-product-id="'+r.product_id+'"><td>'+(i+1)+'</td><td class="product">'+editV2Esc(r.products?.product_name||r.product_name||'')+'</td><td><input class="pts-input" type="number" min="0" step="0.01" data-v2="'+id+'" data-field="primary_pts" value="'+pp+'"></td><td><input class="units-input" type="number" step="1" data-v2="'+id+'" data-field="primary_units" value="'+(r.primary_units??0)+'"></td><td class="value" data-v2-value="'+id+'" data-type="primary">'+editV2Money(editV2Calc(pp,r.primary_units))+'</td><td><input class="pts-input" type="number" min="0" step="0.01" data-v2="'+id+'" data-field="secondary_pts" value="'+sp+'"></td><td><input class="units-input" type="number" step="1" data-v2="'+id+'" data-field="secondary_units" value="'+(r.secondary_units??0)+'"></td><td class="value" data-v2-value="'+id+'" data-type="secondary">'+editV2Money(editV2Calc(sp,r.secondary_units))+'</td><td><button class="remove-btn" type="button" onclick="editV2RemoveProduct(\''+id+'\')">REMOVE</button></td></tr>'}
function editV2AddProduct(){const sel=E('addProductSelect'),productId=sel?.value;if(!productId){editV2ShowMessage('Please select a brand/product to add.','error');return}if(editV2Sales.some(r=>String(r.product_id)===String(productId))){editV2ShowMessage('That brand/product is already in this entry.','error');return}const p=editV2Products.find(x=>String(x.id)===String(productId));if(!p)return;editV2Sales.push({id:null,product_id:p.id,primary_pts:0,secondary_pts:0,pts:0,primary_units:0,secondary_units:0,products:{product_name:p.product_name}});editV2RenderSales();editV2ShowMessage(p.product_name+' added. Enter Primary/Secondary PTS and quantities, then SAVE CHANGES.','success')}
function editV2RemoveProduct(id){const row=editV2Sales.find(r=>String(r.id||('new_'+r.product_id))===String(id));if(!row)return;const name=row.products?.product_name||row.product_name||'product';if(!confirm('Remove '+name+' from this submitted entry?'))return;editV2Sales=editV2Sales.filter(r=>String(r.id||('new_'+r.product_id))!==String(id));editV2RenderSales();editV2ShowMessage(name+' marked for removal. Click SAVE CHANGES to permanently remove it.','success')}
function editV2Calc(pts,units){return(Number(pts)||0)*(Number(units)||0)}
function editV2AttachCalc(){document.querySelectorAll('[data-v2]').forEach(input=>input.addEventListener('input',()=>{const id=input.dataset.v2;let pp=0,sp=0,pu=0,su=0;document.querySelectorAll('[data-v2="'+id+'"]').forEach(x=>{const v=x.value===''?0:Number(x.value)||0;if(x.dataset.field==='primary_pts')pp=v;else if(x.dataset.field==='secondary_pts')sp=v;else if(x.dataset.field==='primary_units')pu=v;else if(x.dataset.field==='secondary_units')su=v;x.classList.add('changed')});const pv=document.querySelector('[data-v2-value="'+id+'"][data-type="primary"]'),sv=document.querySelector('[data-v2-value="'+id+'"][data-type="secondary"]');if(pv)pv.textContent=editV2Money(editV2Calc(pp,pu));if(sv)sv.textContent=editV2Money(editV2Calc(sp,su))}))}
async function editV2SaveCurrentData(){if(editV2Mode==='sales')await editV2SaveSales();else await editV2SaveTargets()}
async function editV2SaveSales(){if(!editV2Header)return;const b=E('saveButton');b.disabled=true;b.textContent='SAVING...';try{const desired=[];document.querySelectorAll('tr[data-product-id]').forEach(tr=>{const productId=tr.dataset.productId,id=tr.dataset.rowId,get=f=>tr.querySelector('[data-v2="'+id+'"][data-field="'+f+'"]');if(!get)return;const pp=get('primary_pts').value===''?0:parseFloat(get('primary_pts').value),sp=get('secondary_pts').value===''?0:parseFloat(get('secondary_pts').value),pu=get('primary_units').value===''?0:parseInt(get('primary_units').value,10),su=get('secondary_units').value===''?0:parseInt(get('secondary_units').value,10);if(!Number.isFinite(pp)||pp<0||!Number.isFinite(sp)||sp<0||!Number.isInteger(pu)||!Number.isInteger(su))throw new Error('Invalid values for '+(tr.querySelector('.product')?.textContent||'product'));desired.push({id:id.startsWith('new_')?null:id,product_id:productId,primary_pts:pp,secondary_pts:sp,primary_units:pu,secondary_units:su})});const desiredIds=new Set();for(const r of desired){const payload={pts:r.primary_pts,primary_pts:r.primary_pts,secondary_pts:r.secondary_pts,primary_units:r.primary_units,secondary_units:r.secondary_units,primary_value:editV2Calc(r.primary_pts,r.primary_units),secondary_value:editV2Calc(r.secondary_pts,r.secondary_units)};if(r.id){desiredIds.add(String(r.id));const{error}=await client.from('sales_entry_details').update(payload).eq('id',r.id).eq('entry_id',editV2Header.id);if(error)throw error}else{const{data:inserted,error}=await client.from('sales_entry_details').insert({entry_id:editV2Header.id,product_id:r.product_id,...payload}).select('id').single();if(error)throw error;if(inserted?.id)desiredIds.add(String(inserted.id))}}const{data:existing,error:ee}=await client.from('sales_entry_details').select('id').eq('entry_id',editV2Header.id);if(ee)throw ee;for(const old of existing||[]){if(!desiredIds.has(String(old.id))){const{error}=await client.from('sales_entry_details').delete().eq('id',old.id).eq('entry_id',editV2Header.id);if(error)throw error}}editV2ShowMessage('Saved successfully. Primary and Secondary PTS/quantities/values were updated.','success');await editV2LoadSales()}catch(e){editV2ShowMessage('Unable to update submitted sales: '+e.message,'error')}finally{b.disabled=false;b.textContent='SAVE CHANGES'}}
async function editV2LoadTargets(){const m=+E('month').value,y=+E('year').value,h=E('hq').value;if(!m||!y||!h){editV2ShowMessage('Please select Month, Year and HQ.','error');return}editV2SetLoading(true,'Loading target sheet...');try{const{data:prods,error:pe}=await client.from('products').select('id,product_name').eq('active',true).order('product_name');if(pe)throw pe;editV2Products=prods||[];const{data:rows,error:te}=await client.from('targets').select('id,product_id,target_units').eq('month',m).eq('year',y).eq('hq_id',h);if(te)throw te;editV2Targets=rows||[];editV2RenderTargets()}catch(e){E('productArea').innerHTML='<div class="message error" style="display:block">'+editV2Esc(e.message)+'</div>'}finally{editV2SetLoading(false)}}
function editV2RenderTargets(){const map={};editV2Targets.forEach(r=>map[r.product_id]=r);let html='<div class="info">Target sheets contain units only. Clear Units to remove that product target.</div><div class="table-container"><table><thead><tr><th>#</th><th>Product</th><th>Target Units</th></tr></thead><tbody>';editV2Products.forEach((p,i)=>{const u=(map[p.id]||{}).target_units??'';html+='<tr><td>'+(i+1)+'</td><td class="product">'+editV2Esc(p.product_name)+'</td><td><input type="number" min="0" step="1" class="target-unit" data-product="'+p.id+'" value="'+u+'"></td></tr>'});html+='</tbody></table></div>';E('productArea').innerHTML=html;E('saveArea').classList.remove('hidden')}
async function editV2SaveTargets(){const m=+E('month').value,y=+E('year').value,h=E('hq').value;if(!m||!y||!h||!editV2Products.length){editV2ShowMessage('Please select Month, Year and HQ and load the target sheet.','error');return}const b=E('saveButton');b.disabled=true;b.textContent='SAVING...';try{const desired=[];for(const p of editV2Products){const text=document.querySelector('.target-unit[data-product="'+p.id+'"]').value.trim()||'';if(!text)continue;const u=parseInt(text,10);if(!Number.isInteger(u)||u<0)throw new Error('Invalid Target Units for '+p.product_name);desired.push({product_id:p.id,target_units:u})}for(const row of desired){const{data:existing,error:qe}=await client.from('targets').select('id').eq('month',m).eq('year',y).eq('hq_id',h).eq('product_id',row.product_id).limit(1);if(qe)throw qe;const payload={target_pts:0,target_units:row.target_units};const{error}=existing?.length?await client.from('targets').update(payload).eq('id',existing[0].id):await client.from('targets').insert({month:m,year:y,hq_id:h,...row});if(error)throw error}const{data:existingAll,error:ae}=await client.from('targets').select('id,product_id').eq('month',m).eq('year',y).eq('hq_id',h);if(ae)throw ae;const keep=new Set(desired.map(r=>String(r.product_id)));for(const old of existingAll||[]){if(!keep.has(String(old.product_id))){const{error}=await client.from('targets').delete().eq('id',old.id);if(error)throw error}}editV2ShowMessage('Target units saved successfully: '+desired.length+' product rows.','success');await editV2LoadTargets()}catch(e){editV2ShowMessage('Unable to update target sheet: '+e.message,'error')}finally{b.disabled=false;b.textContent='SAVE CHANGES'}}
function editV2SetLoading(on,text){E('loadButton').disabled=on;if(on)E('loadButton').textContent=text;else E('loadButton').textContent=editV2Mode==='sales'?'LOAD SUBMITTED SALES':'LOAD TARGET SHEET'}
function editV2ShowMessage(t,type){E('message').textContent=t;E('message').className='message '+type;E('message').style.display='block'}
function editV2Money(v){return(Number(v)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function editV2Esc(t){const d=document.createElement('div');d.textContent=t??'';return d.innerHTML}
function editV2GoHome(){location.href='home.html?v=20260903-4'}
editV2Init();
</script>
</body>
</html>
