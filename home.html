<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hexadox MIS</title>
<link rel="stylesheet" href="style.css">
<style>
.user-info{margin:15px 0 25px 0;line-height:1.6}
.user-name{font-size:20px;font-weight:bold}
.user-role,.user-hq{font-size:15px;color:#555}
#loading{text-align:center;font-weight:bold}
</style>
</head>
<body>
<div class="menu-box">
<h2>HEXADOX MIS</h2>

<div id="loading">Checking Login...</div>

<div id="userInfo" class="user-info" style="display:none;">
<div id="welcome" class="user-name"></div>
<div id="userRole" class="user-role"></div>
<div id="userHQ" class="user-hq"></div>
</div>

<button onclick="window.location.href='data-entry.html'">DATA ENTRY</button>
<button onclick="window.location.href='submitted-data.html'">SUBMITTED DATA</button>

<!-- TARGET SHEET — ADMIN / ABM -->
<button id="targetButton"
        onclick="window.location.href='target.html'"
        style="display:none;">
    TARGET SHEET
</button>

<!-- MASTER DATA — ADMIN ONLY -->
<button id="masterDataButton"
        onclick="window.location.href='master-data.html'"
        style="display:none;">
    MASTER DATA
</button>

<button onclick="logout()">LOGOUT</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

<script>
async function checkSession() {
    const { data, error } = await client.auth.getSession();

    if (error || !data.session) {
        window.location.href = "index.html";
        return;
    }

    const userId = data.session.user.id;

    const { data: profile, error: profileError } =
        await client
            .from("user_profiles")
            .select("id, full_name, role, active")
            .eq("id", userId)
            .single();

    if (profileError || !profile) {
        document.getElementById("loading").innerHTML =
            "User profile could not be loaded.";
        return;
    }

    if (profile.active !== true) {
        await client.auth.signOut();
        window.location.href = "index.html";
        return;
    }

    const { data: mapping } =
        await client
            .from("user_hq_mapping")
            .select("hq_id")
            .eq("user_id", userId)
            .limit(1)
            .maybeSingle();

    let hqName = "HQ not assigned";

    if (mapping && mapping.hq_id) {
        const { data: hq } =
            await client
                .from("hqs")
                .select("hq_name")
                .eq("id", mapping.hq_id)
                .single();

        if (hq) hqName = hq.hq_name;
    }

    document.getElementById("loading").style.display = "none";
    document.getElementById("userInfo").style.display = "block";

    document.getElementById("welcome").innerHTML =
        "Welcome, " + escapeHTML(profile.full_name);

    document.getElementById("userRole").innerHTML =
        "Role: " + escapeHTML(profile.role || "");

    document.getElementById("userHQ").innerHTML =
        "HQ: " + escapeHTML(hqName);

    if (profile.role === "Admin" || profile.role === "ABM") {
        document.getElementById("targetButton").style.display = "block";
    }

    if (profile.role === "Admin") {
        document.getElementById("masterDataButton").style.display = "block";
    }
}

async function logout() {
    await client.auth.signOut();
    window.location.href = "index.html";
}

function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text || "";
    return div.innerHTML;
}

checkSession();
</script>
</body>
</html>
