<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hexadox MIS</title>
<link rel="stylesheet" href="style.css">
<style>
:root{
    --accent:#f4c400;
    --accent-dark:#d7a900;
    --text:#17202a;
    --muted:#667085;
    --glass:rgba(255,255,255,.58);
    --glass-border:rgba(255,255,255,.72);
    --shadow:0 18px 45px rgba(31,41,55,.12);
}

*{box-sizing:border-box}

html,body{min-height:100%;margin:0}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 12% 12%,rgba(244,196,0,.24),transparent 28%),
        radial-gradient(circle at 88% 18%,rgba(255,255,255,.9),transparent 30%),
        linear-gradient(135deg,#f7f7f4 0%,#eceff1 48%,#f7f7f4 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px;
    overflow-x:hidden;
}

body::before,
body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    filter:blur(4px);
    pointer-events:none;
    z-index:-1;
}

body::before{
    width:260px;height:260px;
    background:rgba(244,196,0,.16);
    left:-80px;bottom:-80px;
}

body::after{
    width:300px;height:300px;
    background:rgba(255,255,255,.8);
    right:-100px;top:-100px;
}

.menu-box{
    width:min(1500px,100%);
    min-height:calc(100vh - 56px);
    padding:34px 42px 28px;
    border:1px solid var(--glass-border);
    border-radius:30px;
    background:var(--glass);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    box-shadow:var(--shadow);
}

.menu-box h2{
    margin:0;
    text-align:left;
    font-size:30px;
    letter-spacing:.6px;
}

.menu-box h2::after{
    content:"";
    display:block;
    width:62px;
    height:5px;
    margin-top:10px;
    border-radius:10px;
    background:var(--accent);
}

.user-info{
    margin:20px 0 28px;
    padding:15px 18px;
    border-radius:18px;
    background:rgba(255,255,255,.48);
    border:1px solid rgba(255,255,255,.75);
    box-shadow:0 8px 22px rgba(31,41,55,.06);
    line-height:1.55;
}

.user-name{
    font-size:19px;
    font-weight:700;
}

.user-role,.user-hq{
    font-size:14px;
    color:var(--muted);
}

#loading{
    text-align:center;
    font-weight:700;
    padding:30px;
}

.tab-grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(190px,1fr));
    gap:18px;
    margin-top:8px;
}

.mis-tab{
    min-height:145px;
    width:100%;
    margin:0!important;
    padding:20px!important;
    border:1px solid rgba(255,255,255,.78)!important;
    border-radius:22px!important;
    background:rgba(255,255,255,.55)!important;
    color:var(--text)!important;
    box-shadow:0 10px 28px rgba(31,41,55,.08)!important;
    display:flex!important;
    flex-direction:column;
    align-items:flex-start;
    justify-content:center;
    gap:12px;
    cursor:pointer;
    text-align:left;
    transition:transform .2s ease,box-shadow .2s ease,background .2s ease;
}

.mis-tab:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,.78)!important;
    box-shadow:0 18px 34px rgba(31,41,55,.13)!important;
}

.mis-tab:active{transform:translateY(-1px)}

.tab-icon{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:13px;
    background:rgba(244,196,0,.18);
    color:#8b6b00;
}

.tab-icon svg{
    width:21px;
    height:21px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.9;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.tab-title{
    font-size:16px;
    font-weight:700;
    letter-spacing:.1px;
}

.tab-subtitle{
    font-size:12px;
    color:var(--muted);
}

.future-tab{
    cursor:default!important;
    opacity:.68;
    border-style:dashed!important;
}

.future-tab:hover{
    transform:none;
    background:rgba(255,255,255,.55)!important;
}

.future-tab .tab-icon{
    background:rgba(102,112,133,.10);
    color:#7b8492;
}

.future-badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:999px;
    background:rgba(102,112,133,.10);
    color:#667085;
    font-size:10px;
    font-weight:700;
    letter-spacing:.5px;
}

.logout-row{
    display:flex;
    justify-content:flex-end;
    margin-top:24px;
}

.logout-button{
    width:auto!important;
    min-width:120px;
    padding:11px 20px!important;
    margin:0!important;
    border:1px solid rgba(255,255,255,.8)!important;
    border-radius:14px!important;
    background:rgba(255,255,255,.48)!important;
    color:#4b5563!important;
    font-weight:700;
    cursor:pointer;
}

.logout-button:hover{
    background:rgba(255,255,255,.78)!important;
}

@media(max-width:900px){
    .tab-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .menu-box{min-height:auto}
}

@media(max-width:560px){
    body{padding:12px}
    .menu-box{padding:24px 18px;border-radius:22px}
    .menu-box h2{font-size:24px}
    .tab-grid{grid-template-columns:1fr}
    .mis-tab{min-height:125px}
}
</style>
</head>
<body>
<div class="menu-box">

    <h2>HEXADOX MIS</h2>

    <div id="loading">Checking Login...</div>

    <div id="userInfo" class="user-info" style="display:none;">
        <div id="welcome" class="user-name"></div>
        <div id="userRole" class="user-role"></div>
        <div id="userHQ" class="user-hq"></div>
    </div>

    <div class="tab-grid">

        <button class="mis-tab" onclick="window.location.href='data-entry.html'">
            <span class="tab-icon">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </span>
            <span class="tab-title">DATA ENTRY</span>
            <span class="tab-subtitle">Enter monthly sales</span>
        </button>

        <button class="mis-tab" onclick="window.location.href='submitted-data.html'">
            <span class="tab-icon">
                <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
            </span>
            <span class="tab-title">SUBMITTED DATA</span>
            <span class="tab-subtitle">View submitted sales</span>
        </button>

        <button id="editDataButton" class="mis-tab"
                onclick="window.location.href='edit-data.html'"
                style="display:none;">
            <span class="tab-icon">
                <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/></svg>
            </span>
            <span class="tab-title">EDIT SUBMITTED DATA</span>
            <span class="tab-subtitle">Correct or add brands</span>
        </button>

        <button id="targetButton" class="mis-tab"
                onclick="window.location.href='target.html'"
                style="display:none;">
            <span class="tab-icon">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v2M22 12h-2M12 22v-2M2 12h2"/></svg>
            </span>
            <span class="tab-title">TARGET SHEET</span>
            <span class="tab-subtitle">Manage monthly targets</span>
        </button>

        <button id="masterDataButton" class="mis-tab"
                onclick="window.location.href='master-data.html'"
                style="display:none;">
            <span class="tab-icon">
                <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>
            </span>
            <span class="tab-title">MASTER DATA</span>
            <span class="tab-subtitle">Manage users and masters</span>
        </button>

        <div class="mis-tab future-tab">
            <span class="tab-icon">
                <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="m7 15 4-4 3 2 5-6"/></svg>
            </span>
            <span class="tab-title">SALES REPORTS</span>
            <span class="tab-subtitle">Analytics and dashboards</span>
            <span class="future-badge">COMING SOON</span>
        </div>

        <div class="mis-tab future-tab">
            <span class="tab-icon">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.8-3.4 3-5 7-5s6.2 1.6 7 5"/></svg>
            </span>
            <span class="tab-title">DOCTOR ANALYTICS</span>
            <span class="tab-subtitle">Coverage and prescription insights</span>
            <span class="future-badge">COMING SOON</span>
        </div>

        <div class="mis-tab future-tab">
            <span class="tab-icon">
                <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v1a7 7 0 0 0-4 6v3h14v-3a7 7 0 0 0-4-6V6a3 3 0 0 0-3-3z"/><path d="M9 20h6"/></svg>
            </span>
            <span class="tab-title">MORE MODULES</span>
            <span class="tab-subtitle">Reserved for future MIS features</span>
            <span class="future-badge">RESERVED</span>
        </div>

    </div>

    <div class="logout-row">
        <button class="logout-button" onclick="logout()">LOGOUT</button>
    </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

<script>
async function checkSession() {
    const { data, error } = await client.auth.getSession();

    if (error || !data.session) {
        window.location.href = "index.html";
        return;
    }

    const userId = data.session.user.id;

    const { data: profile, error: profileError } =
        await client
            .from("user_profiles")
            .select("id, full_name, role, active")
            .eq("id", userId)
            .single();

    if (profileError || !profile) {
        document.getElementById("loading").innerHTML =
            "User profile could not be loaded.";
        return;
    }

    if (profile.active !== true) {
        await client.auth.signOut();
        window.location.href = "index.html";
        return;
    }

    const { data: mapping } =
        await client
            .from("user_hq_mapping")
            .select("hq_id")
            .eq("user_id", userId)
            .limit(1)
            .maybeSingle();

    let hqName = "HQ not assigned";

    if (mapping && mapping.hq_id) {
        const { data: hq } =
            await client
                .from("hqs")
                .select("hq_name")
                .eq("id", mapping.hq_id)
                .single();

        if (hq) hqName = hq.hq_name;
    }

    document.getElementById("loading").style.display = "none";
    document.getElementById("userInfo").style.display = "block";

    document.getElementById("welcome").innerHTML =
        "Welcome, " + escapeHTML(profile.full_name);

    document.getElementById("userRole").innerHTML =
        "Role: " + escapeHTML(profile.role || "");

    document.getElementById("userHQ").innerHTML =
        "HQ: " + escapeHTML(hqName);

    if (profile.role === "Admin" || profile.role === "ABM") {
        document.getElementById("targetButton").style.display = "block";
        document.getElementById("editDataButton").style.display = "block";
    }

    if (profile.role === "Admin") {
        document.getElementById("masterDataButton").style.display = "block";
    }
}

async function logout() {
    await client.auth.signOut();
    window.location.href = "index.html";
}

function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text || "";
    return div.innerHTML;
}

checkSession();
</script>
</body>
</html>
