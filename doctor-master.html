<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Hexadox MIS - Doctor Master</title><link rel="stylesheet" href="style.css?v=20260906-2"><link rel="stylesheet" href="theme-yellow.css"></head><body><div class="container"><div class="page-top"><h2>DOCTOR MASTER</h2><button class="back-button" onclick="location.href='home.html'">HOME</button></div>
<div class="card"><h3>Add Doctor</h3><div class="form-grid"><div><label>Doctor Name</label><input id="doctorName" placeholder="Enter doctor name"></div><div><label>HQ</label><select id="hq" onchange="loadMarkets()"><option value="">Select HQ</option></select></div><div><label>Market</label><select id="market"><option value="">Select Market</option></select></div></div><div class="actions"><button class="btn" onclick="saveDoctor()">+ ADD DOCTOR</button></div><div class="inline-add"><input id="newMarket" placeholder="New Market Name"><button class="small-btn" onclick="addMarket()">+ ADD MARKET TO SELECTED HQ</button></div><div id="message" class="message"></div></div>
<div class="card"><h3>Doctor List</h3><div class="filters"><select id="filterHQ" onchange="loadFilterMarkets();loadDoctors()"><option value="">All HQs</option></select><select id="filterMarket" onchange="loadDoctors()"><option value="">All Markets</option></select><input id="search" placeholder="Search doctor" oninput="renderDoctors()"></div><div class="table-wrap"><table><thead><tr><th>Doctor</th><th>HQ</th><th>Market</th><th>Status</th><th>Action</th></tr></thead><tbody id="doctorRows"></tbody></table></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=20260906-2"></script><script>
let hqs=[],markets=[],doctors=[];const msg=(t,e=false)=>{const x=document.getElementById('message');x.textContent=t;x.className='message '+(e?'error':'success')};
async function init(){const r=await getCurrentUserProfile();if(r.error){location.href='index.html';return}const z=await client.from('hqs').select('id,hq_name').eq('active',true).order('hq_name');if(z.error){msg(z.error.message,true);return}hqs=z.data||[];hq.innerHTML='<option value="">Select HQ</option>'+hqs.map(x=>`<option value="${x.id}">${esc(x.hq_name)}</option>`).join('');filterHQ.innerHTML='<option value="">All HQs</option>'+hqs.map(x=>`<option value="${x.id}">${esc(x.hq_name)}</option>`).join('');await loadMarkets();await loadFilterMarkets();await loadDoctors()}
async function loadMarkets(){const h=hq.value;let q=client.from('markets').select('id,market_name,hq_id').eq('active',true).order('market_name');if(h)q=q.eq('hq_id',h);const z=await q;if(z.error){msg(z.error.message,true);return}markets=z.data||[];market.innerHTML='<option value="">Select Market</option>'+markets.map(x=>`<option value="${x.id}">${esc(x.market_name)}</option>`).join('')}
async function loadFilterMarkets(){const h=filterHQ.value;let q=client.from('markets').select('id,market_name').eq('active',true).order('market_name');if(h)q=q.eq('hq_id',h);const z=await q;filterMarket.innerHTML='<option value="">All Markets</option>'+(z.data||[]).map(x=>`<option value="${x.id}">${esc(x.market_name)}</option>`).join('')}
async function addMarket(){const h=hq.value,n=newMarket.value.trim();if(!h||!n){msg('Select an HQ and enter a Market Name.',true);return}const z=await client.from('markets').insert({hq_id:h,market_name:n});if(z.error){msg(z.error.message,true);return}newMarket.value='';msg('Market added successfully.');await loadMarkets();market.value=[...market.options].findIndex(o=>o.text===n)>0?[...market.options].find(o=>o.text===n).value:'';await loadFilterMarkets()}
async function saveDoctor(){const name=doctorName.value.trim(),h=hq.value,m=market.value;if(!name||!h||!m){msg('Enter Doctor Name, HQ and Market.',true);return}const chk=await client.from('markets').select('id,hq_id').eq('id',m).single();if(chk.error||chk.data.hq_id!==h){msg('Selected Market does not belong to the selected HQ.',true);return}const existing=await client.from('doctors').select('id').eq('doctor_name',name).eq('hq_id',h).eq('market_id',m).eq('active',true).limit(1);if(existing.data?.length){msg('This doctor is already in the master.',true);return}const z=await client.from('doctors').insert({doctor_name:name,hq_id:h,market_id:m});if(z.error){msg(z.error.message,true);return}doctorName.value='';msg('Doctor added successfully.');await loadDoctors()}
async function loadDoctors(){const fh=filterHQ.value,fm=filterMarket.value;let q=client.from('doctors').select('id,doctor_name,hq_id,market_id,active,hqs(hq_name),markets(market_name)').order('doctor_name');if(fh)q=q.eq('hq_id',fh);if(fm)q=q.eq('market_id',fm);const z=await q;if(z.error){msg(z.error.message,true);return}doctors=z.data||[];renderDoctors()}
function renderDoctors(){const s=search.value.toLowerCase();doctorRows.innerHTML=doctors.filter(d=>d.doctor_name.toLowerCase().includes(s)).map(d=>`<tr><td>${esc(d.doctor_name)}</td><td>${esc(d.hqs?.hq_name||'')}</td><td>${esc(d.markets?.market_name||'')}</td><td>${d.active?'Active':'Inactive'}</td><td><button class="small-btn" onclick="toggleDoctor('${d.id}',${d.active})">${d.active?'Deactivate':'Activate'}</button></td></tr>`).join('')||'<tr><td colspan="5">No doctors found.</td></tr>'}
async function toggleDoctor(id,a){const z=await client.from('doctors').update({active:!a}).eq('id',id);if(z.error){msg(z.error.message,true);return}await loadDoctors()}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}init();
</script></body></html>
