name: Apply dashboard layout fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply dashboard treemap') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        shell: python
        run: |
          from pathlib import Path
          p = Path('dashboard.html')
          s = p.read_text(encoding='utf-8')
          old = '.brand-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch}'
          new = '.brand-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:stretch;width:100%;grid-column:1 / -1;min-width:0}'
          if old not in s:
              raise SystemExit('brand-grid CSS pattern not found')
          s = s.replace(old, new, 1)
          old = "backgroundColor:'rgba(31,119,180,0.75)'"
          new = "backgroundColor:ctx=>{const colors=['#2563EB','#0F766E','#D97706','#7C3AED','#DB2777','#0891B2','#16A34A','#EA580C','#4F46E5','#C026D3'];return colors[ctx.dataIndex%colors.length]}"
          if old not in s:
              raise SystemExit('treemap color pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.html .github/workflows/dashboard-fix.yml
          git rm .github/workflows/dashboard-fix.yml
          git commit -m 'Apply dashboard treemap layout and colours'
          git push
