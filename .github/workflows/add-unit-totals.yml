name: Add Unit Totals
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'Add unit totals to MIS pages') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update MIS pages
        shell: python
        run: |
          from pathlib import Path
          import re

          # DATA ENTRY: add Primary/Secondary Unit totals to the existing footer and calculation.
          p = Path('data-entry.html')
          s = p.read_text(encoding='utf-8')
          old = '<tfoot><tr class="totals-row">\\n                    <td colspan="4">TOTAL</td><td id="total-primary">0.00</td><td>-</td><td id="total-secondary">0.00</td><td>-</td>\\n                </tr></tfoot>'
          new = '<tfoot><tr class="totals-row">\\n                    <td colspan="3">TOTAL</td><td id="total-primary-units">0</td><td id="total-primary">0.00</td><td id="total-secondary-units">0</td><td id="total-secondary">0.00</td><td>-</td>\\n                </tr></tfoot>'
          if old in s and 'total-primary-units' not in s:
              s = s.replace(old, new, 1)
          old_calc = 'let primaryTotal = 0, secondaryTotal = 0;'
          new_calc = 'let primaryTotal = 0, secondaryTotal = 0, primaryUnitsTotal = 0, secondaryUnitsTotal = 0;'
          if old_calc in s and 'primaryUnitsTotal' not in s:
              s = s.replace(old_calc, new_calc, 1)
              s = s.replace('primaryTotal += pts * primary;\\n        secondaryTotal += pts * secondary;', 'primaryUnitsTotal += primary;\\n        secondaryUnitsTotal += secondary;\\n        primaryTotal += pts * primary;\\n        secondaryTotal += pts * secondary;', 1)
              s = s.replace('if (document.getElementById("total-primary")) document.getElementById("total-primary").textContent = primaryTotal.toFixed(2);', 'if (document.getElementById("total-primary-units")) document.getElementById("total-primary-units").textContent = primaryUnitsTotal.toLocaleString("en-IN");\\n    if (document.getElementById("total-primary")) document.getElementById("total-primary").textContent = primaryTotal.toFixed(2);', 1)
              s = s.replace('if (document.getElementById("total-secondary")) document.getElementById("total-secondary").textContent = secondaryTotal.toFixed(2);', 'if (document.getElementById("total-secondary-units")) document.getElementById("total-secondary-units").textContent = secondaryUnitsTotal.toLocaleString("en-IN");\\n    if (document.getElementById("total-secondary")) document.getElementById("total-secondary").textContent = secondaryTotal.toFixed(2);', 1)
          p.write_text(s, encoding='utf-8')

          # SUBMITTED DATA: add unit totals to the existing bottom TOTAL row.
          p = Path('submitted-data.html')
          s = p.read_text(encoding='utf-8')
          if 'TOTAL PRIMARY UNITS' not in s:
              needle = "let pv=0,sv=0,html='<h3>Submitted Sales</h3>"
              if needle in s:
                  s = s.replace(needle, "let puTotal=0,suTotal=0,pv=0,sv=0,html='<h3>Submitted Sales</h3>", 1)
              s = s.replace('pv+=p;sv+=sv2;html+=', 'puTotal+=Number(d.primary_units)||0;suTotal+=Number(d.secondary_units)||0;pv+=p;sv+=sv2;html+=', 1)
              s = s.replace('<tr class="total"><td colspan="3">TOTAL</td><td>'+"'+'"+'+money(pv)+"'+'"+'</td><td></td><td></td><td>'+"'+'"+'+money(sv)+"'+'"+'</td></tr>', '<tr class="total"><td>TOTAL</td><td></td><td>'+"'+'"+'+num(puTotal)+"'+'"+'</td><td>'+"'+'"+'+money(pv)+"'+'"+'</td><td></td><td>'+"'+'"+'+num(suTotal)+"'+'"+'</td><td>'+"'+'"+'+money(sv)+"'+'"+'</td></tr>', 1)
              # Also handle the alternate current implementation exactly.
              s = s.replace('html+=\'<tr class="total"><td colspan="3">TOTAL</td><td>\'+money(pv)+\'</td><td></td><td></td><td>\'+money(sv)+\'</td></tr>', 'html+=\'<tr class="total"><td>TOTAL</td><td></td><td>\'+num(puTotal)+\'</td><td>\'+money(pv)+\'</td><td></td><td>\'+num(suTotal)+\'</td><td>\'+money(sv)+\'</td></tr>', 1)
          p.write_text(s, encoding='utf-8')

          # EDIT SUBMITTED DATA v2: add live unit totals to the rendered sales table.
          p = Path('edit-data-v2.html')
          s = p.read_text(encoding='utf-8')
          if 'edit-total-primary-units' not in s:
              marker = "html+='</tbody></table></div>';$('productArea').innerHTML=h;"
              replacement = "html+='<tfoot><tr class=\\\"total\\\"><td colspan=\\\"3\\\">TOTAL</td><td class=\\\"num edit-total-primary-units\\\">0</td><td class=\\\"value edit-total-primary\\\">0.00</td><td></td><td class=\\\"num edit-total-secondary-units\\\">0</td><td class=\\\"value edit-total-secondary\\\">0.00</td><td></td></tr></tfoot></tbody></table></div>';$('productArea').innerHTML=h;"
              if marker in s:
                  s=s.replace(marker,replacement,1)
              marker2 = "r.querySelector('.sv').textContent=money(sp*su);"
              if marker2 in s:
                  s=s.replace(marker2, marker2+"updateEditSalesTotals();",1)
              # Insert total updater before addProduct.
              insert = "function updateEditSalesTotals(){let pu=0,pv=0,su=0,sv=0;document.querySelectorAll('#productArea tr[data-id]').forEach(r=>{const pp=+r.querySelector('[data-f=\\\"pp\\\"]').value||0,puv=+r.querySelector('[data-f=\\\"pu\\\"]').value||0,sp=+r.querySelector('[data-f=\\\"sp\\\"]').value||0,suv=+r.querySelector('[data-f=\\\"su\\\"]').value||0;pu+=puv;pv+=pp*puv;su+=suv;sv+=sp*suv});const a=document.querySelector('.edit-total-primary-units'),b=document.querySelector('.edit-total-primary'),c=document.querySelector('.edit-total-secondary-units'),d=document.querySelector('.edit-total-secondary');if(a)a.textContent=pu.toLocaleString('en-IN');if(b)b.textContent=money(pv);if(c)c.textContent=su.toLocaleString('en-IN');if(d)d.textContent=money(sv)}\n"
              pos=s.find('function addProduct()')
              if pos>=0:s=s[:pos]+insert+s[pos:]
              s=s.replace('renderSales();msg(p.product_name+', 'renderSales();updateEditSalesTotals();msg(p.product_name+', 1)
              s=s.replace("renderSales();msg('Product marked", "renderSales();updateEditSalesTotals();msg('Product marked", 1)
              s=s.replace("renderSales()}catch", "renderSales();updateEditSalesTotals()}catch", 1)
          p.write_text(s, encoding='utf-8')

          print('Unit-total update applied where matching current MIS structures were found.')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-entry.html submitted-data.html edit-data-v2.html
          git diff --cached --quiet && exit 0
          git commit -m "Add unit totals to MIS pages"
          git push