name: Add Unit Totals
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'Add unit totals to MIS pages') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply unit totals
        shell: python
        run: |
          from pathlib import Path
          import re

          def write(path, transform):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              ns = transform(s)
              p.write_text(ns, encoding='utf-8')
              print(path, 'changed:', ns != s)

          def data_entry(s):
              if 'total-primary-units' not in s:
                  s, _ = re.subn(r'<tfoot>\s*<tr class="totals-row">.*?</tr>\s*</tfoot>', '<tfoot><tr class="totals-row"><td colspan="3">TOTAL</td><td id="total-primary-units">0</td><td id="total-primary">0.00</td><td id="total-secondary-units">0</td><td id="total-secondary">0.00</td><td>-</td></tr></tfoot>', s, count=1, flags=re.S)
              if 'primaryUnitsTotal' not in s:
                  s = s.replace('let primaryTotal = 0, secondaryTotal = 0;', 'let primaryTotal = 0, secondaryTotal = 0, primaryUnitsTotal = 0, secondaryUnitsTotal = 0;', 1)
                  s = re.sub(r'(primaryTotal\s*\+=\s*pts\s*\*\s*primary;)', r'primaryUnitsTotal += primary;\n        \1', s, count=1)
                  s = re.sub(r'(secondaryTotal\s*\+=\s*pts\s*\*\s*secondary;)', r'secondaryUnitsTotal += secondary;\n        \1', s, count=1)
                  s = s.replace('if (document.getElementById("total-primary")) document.getElementById("total-primary").textContent = primaryTotal.toFixed(2);', 'if (document.getElementById("total-primary-units")) document.getElementById("total-primary-units").textContent = primaryUnitsTotal.toLocaleString("en-IN");\n    if (document.getElementById("total-primary")) document.getElementById("total-primary").textContent = primaryTotal.toFixed(2);', 1)
                  s = s.replace('if (document.getElementById("total-secondary")) document.getElementById("total-secondary").textContent = secondaryTotal.toFixed(2);', 'if (document.getElementById("total-secondary-units")) document.getElementById("total-secondary-units").textContent = secondaryUnitsTotal.toLocaleString("en-IN");\n    if (document.getElementById("total-secondary")) document.getElementById("total-secondary").textContent = secondaryTotal.toFixed(2);', 1)
              return s
          write('data-entry.html', data_entry)

          def submitted(s):
              if 'puTotal' not in s:
                  s = s.replace('let pv=0,sv=0;', 'let puTotal=0,suTotal=0,pv=0,sv=0;', 1)
                  s = s.replace('pv+=p;sv+=s2;', 'puTotal+=Number(d.primary_units)||0;suTotal+=Number(d.secondary_units)||0;pv+=p;sv+=s2;', 1)
                  old = '''html+='<tr class="total"><td colspan="3">TOTAL PRIMARY</td><td>'+money(pv)+'</td><td colspan="2">TOTAL SECONDARY</td><td>'+money(sv)+'</td></tr>'''
                  new = '''html+='<tr class="total"><td>TOTAL</td><td></td><td>'+n(puTotal)+'</td><td>'+money(pv)+'</td><td></td><td>'+n(suTotal)+'</td><td>'+money(sv)+'</td></tr>'''
                  s = s.replace(old, new, 1)
              return s
          write('submitted-data.html', submitted)

          def edit_page(s):
              if 'edit-total-primary-units' in s:
                  return s
              marker = "html+='</tbody></table></div>';"
              if marker in s:
                  footer = "html+='<tfoot><tr class=\"total\"><td colspan=\"3\">TOTAL</td><td class=\"edit-total-primary-units\">0</td><td class=\"edit-total-primary\">0.00</td><td></td><td class=\"edit-total-secondary-units\">0</td><td class=\"edit-total-secondary\">0.00</td><td></td></tr></tfoot></tbody></table></div>';"
                  s = s.replace(marker, footer, 1)
              if '[data-f="primary_pts"]' in s:
                  fn = '''function updateEditSalesTotals(){let pu=0,pv=0,su=0,sv=0;document.querySelectorAll('#productArea tr[data-id]').forEach(r=>{const pp=+r.querySelector('[data-f="primary_pts"]').value||0,p=+r.querySelector('[data-f="primary_units"]').value||0,sp=+r.querySelector('[data-f="secondary_pts"]').value||0,s=+r.querySelector('[data-f="secondary_units"]').value||0;pu+=p;pv+=pp*p;su+=s;sv+=sp*s});const a=document.querySelector('.edit-total-primary-units'),b=document.querySelector('.edit-total-primary'),c=document.querySelector('.edit-total-secondary-units'),d=document.querySelector('.edit-total-secondary');if(a)a.textContent=pu.toLocaleString('en-IN');if(b)b.textContent=money(pv);if(c)c.textContent=su.toLocaleString('en-IN');if(d)d.textContent=money(sv)}
'''
              else:
                  fn = '''function updateEditSalesTotals(){let pu=0,pv=0,su=0,sv=0;document.querySelectorAll('#productArea tr[data-id]').forEach(r=>{const pp=+r.querySelector('[data-f="pp"]').value||0,p=+r.querySelector('[data-f="pu"]').value||0,sp=+r.querySelector('[data-f="sp"]').value||0,s=+r.querySelector('[data-f="su"]').value||0;pu+=p;pv+=pp*p;su+=s;sv+=sp*s});const a=document.querySelector('.edit-total-primary-units'),b=document.querySelector('.edit-total-primary'),c=document.querySelector('.edit-total-secondary-units'),d=document.querySelector('.edit-total-secondary');if(a)a.textContent=pu.toLocaleString('en-IN');if(b)b.textContent=money(pv);if(c)c.textContent=su.toLocaleString('en-IN');if(d)d.textContent=money(sv)}
'''
              pos = s.find('function renderSales()')
              if pos >= 0 and 'function updateEditSalesTotals()' not in s:
                  s = s[:pos] + fn + s[pos:]
              s = re.sub(r"(r\.querySelector\('\.sv'\)\.textContent=money\([^;]+;)", r"\1updateEditSalesTotals();", s, count=1)
              if "updateEditSalesTotals();$('saveArea').classList.remove('hidden');" not in s:
                  s = s.replace("$('saveArea').classList.remove('hidden');", "updateEditSalesTotals();$('saveArea').classList.remove('hidden');", 1)
              return s

          for name in ('edit-data.html','edit-data-v2.html'):
              if Path(name).exists():
                  write(name, edit_page)

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-entry.html submitted-data.html edit-data.html edit-data-v2.html
          git diff --cached --quiet && exit 0
          git commit -m "Add unit totals to MIS pages"
          git push
