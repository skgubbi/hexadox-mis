name: Add Unit Totals
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'Add unit totals to MIS pages') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply unit totals
        run: python .github/scripts/add_unit_totals.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-entry.html submitted-data.html edit-data.html edit-data-v2.html
          git diff --cached --quiet && exit 0
          git commit -m "Add unit totals to MIS pages"
          git push
