<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hexadox MIS - Submitted Data</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f6;color:#222}.header{background:#008f87;color:#fff;padding:18px 25px;display:flex;justify-content:space-between;align-items:center}.header h2{margin:0;font-size:22px}.back-button{background:#fff;color:#008f87;border:0;padding:9px 16px;border-radius:5px;cursor:pointer;font-weight:bold}.container{max-width:1250px;margin:25px auto;padding:0 15px}.card{background:#fff;padding:22px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:20px}.card h3{margin-top:0;color:#008f87}.view-toggle{display:flex;gap:10px;margin-bottom:20px}.view-button{border:1px solid #008f87;background:#fff;color:#008f87;padding:10px 18px;border-radius:6px;font-weight:bold;cursor:pointer}.view-button.active{background:#008f87;color:#fff}.selection-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}label{display:block;font-weight:bold;margin-bottom:7px}select{width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;font-size:15px}select:disabled{background:#eee}.search-area{text-align:center;margin-top:20px}.search-button{background:#008f87;color:#fff;border:0;padding:12px 40px;border-radius:6px;font-size:16px;font-weight:bold;cursor:pointer}.search-button:disabled{background:#999;cursor:not-allowed}.table-container{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}th{background:#008f87;color:#fff;padding:11px 8px;text-align:center}td{padding:8px;border-bottom:1px solid #ddd;text-align:center}td.product-name{text-align:left;font-weight:500}.number-cell{text-align:right}.totals-row{font-weight:bold;background:#f1f5f5}.abm-row{font-weight:bold;background:#fff2b8;border-top:2px solid #d7ad00}.submission-info{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.info-box{background:#f5f8f8;padding:12px;border-radius:6px}.info-label{font-size:12px;color:#666;margin-bottom:5px}.info-value{font-weight:bold}.message{margin-top:15px;padding:12px;border-radius:5px;display:none;text-align:center;font-weight:bold}.success{background:#d9f5e9;color:#146c43}.error{background:#f8d7da;color:#842029}.loading{text-align:center;padding:25px;font-weight:bold;color:#008f87}@media(max-width:800px){.selection-grid{grid-template-columns:repeat(2,1fr)}.submission-info{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.selection-grid,.submission-info{grid-template-columns:1fr}.header h2{font-size:18px}}
</style>
</head>
<body>
<div class="header"><h2>HEXADOX MIS — SUBMITTED DATA</h2><button class="back-button" onclick="goHome()">HOME</button></div>
<div class="container">
<div class="card">
<h3>Find Submission</h3>
<div class="view-toggle"><button id="salesViewButton" class="view-button active" onclick="setView('sales')">SUBMITTED SALES</button><button id="targetViewButton" class="view-button" onclick="setView('targets')">SUBMITTED TARGETS</button></div>
<div class="selection-grid">
<div><label for="month">Month</label><select id="month"><option value="">Select Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select></div>
<div><label for="year">Year</label><select id="year"><option value="">Select Year</option></select></div>
<div><label for="hq">HQ</label><select id="hq"><option value="">Loading HQ...</option></select></div>
<div id="stockistFilter"><label for="stockist">Stockist</label><select id="stockist" disabled><option value="">Select Stockist</option></select></div>
</div>
<div class="search-area"><button id="searchButton" class="search-button" onclick="runSearch()">SEARCH</button></div>
</div>
<div class="card"><div id="resultArea"><div class="loading">Select the filters and click SEARCH.</div></div></div>
<div id="message" class="message"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script>
<script>
let currentView='sales';
function initializePage(){client.auth.getSession().then(async({data,error})=>{if(error||!data.session){location.href='index.html';return}loadYears();await loadHQs();});}
function loadYears(){const s=document.getElementById('year'),y=new Date().getFullYear();for(let n=y-2;n<=y+1;n++){const o=document.createElement('option');o.value=n;o.textContent=n;s.appendChild(o)}s.value=y;document.getElementById('month').value=new Date().getMonth()+1}
async function loadHQs(){const s=document.getElementById('hq');const{data,error}=await client.from('hqs').select('id,hq_name').eq('active',true).order('hq_name');if(error){showMessage('Unable to load HQs: '+error.message,'error');return}s.innerHTML='<option value="">Select HQ</option><option value="ALL">All HQs</option>';(data||[]).forEach(h=>{const o=document.createElement('option');o.value=h.id;o.textContent=h.hq_name;s.appendChild(o)})}
document.getElementById('hq').addEventListener('change',()=>{if(currentView==='sales')loadStockists()});
async function loadStockists(){const h=document.getElementById('hq').value,s=document.getElementById('stockist');s.disabled=true;s.innerHTML='<option value="">Loading Stockists...</option>';if(!h||h==='ALL'){s.innerHTML='<option value="">Select Stockist</option>';return}const{data,error}=await client.from('stockists').select('id,stockist_name').eq('hq_id',h).eq('active',true).order('stockist_name');if(error){showMessage('Unable to load stockists: '+error.message,'error');return}s.innerHTML='<option value="">Select Stockist</option>';(data||[]).forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.stockist_name;s.appendChild(o)});s.disabled=false}
function setView(view){currentView=view;document.getElementById('salesViewButton').classList.toggle('active',view==='sales');document.getElementById('targetViewButton').classList.toggle('active',view==='targets');document.getElementById('stockistFilter').style.display=view==='targets'?'none':'block';document.getElementById('resultArea').innerHTML='<div class="loading">Select the filters and click SEARCH.</div>';if(view==='sales')loadStockists()}
function runSearch(){currentView==='targets'?searchTargetSheet():searchSubmission()}
async function searchSubmission(){const m=+document.getElementById('month').value,y=+document.getElementById('year').value,h=document.getElementById('hq').value,s=document.getElementById('stockist').value;if(!m||!y||!h||h==='ALL'||!s){showMessage('Please select Month, Year, HQ and Stockist.','error');return}const area=document.getElementById('resultArea'),b=document.getElementById('searchButton');area.innerHTML='<div class="loading">Searching...</div>';b.disabled=true;try{const{data:heads,error:he}=await client.from('sales_entry_header').select('id,stockist_id,hq_id,month,year,entered_by,created_at').eq('stockist_id',s).eq('hq_id',h).eq('month',m).eq('year',y).limit(1);if(he)throw he;if(!heads||!heads.length){area.innerHTML='<div class="loading">No submitted data found for the selected combination.</div>';return}const head=heads[0];const{data:details,error:de}=await client.from('sales_entry_details').select('id,entry_id,product_id,pts,primary_units,secondary_units,primary_value,secondary_value').eq('entry_id',head.id);if(de)throw de;const ids=(details||[]).map(d=>d.product_id);const{data:products,error:pe}=await client.from('products').select('id,product_name').in('id',ids);if(pe)throw pe;const{data:hq,error:qe}=await client.from('hqs').select('id,hq_name').eq('id',h).single();if(qe)throw qe;const{data:stk,error:se}=await client.from('stockists').select('id,stockist_name').eq('id',s).single();if(se)throw se;renderSales(head,details||[],products||[],hq,stk)}catch(e){area.innerHTML='<div class="message error" style="display:block">'+escapeHTML(e.message)+'</div>'}finally{b.disabled=false}}
function renderSales(head,details,products,hq,stk){const map={};products.forEach(p=>map[p.id]=p.product_name);const rows=details.filter(d=>(+d.primary_units||0)>0||(+d.secondary_units||0)>0);let pv=0,sv=0,html='<h3>Submitted Sales</h3><div class="submission-info"><div class="info-box"><div class="info-label">Month</div><div class="info-value">'+getMonthName(head.month)+' '+head.year+'</div></div><div class="info-box"><div class="info-label">HQ</div><div class="info-value">'+escapeHTML(hq?.hq_name||'')+'</div></div><div class="info-box"><div class="info-label">Stockist</div><div class="info-value">'+escapeHTML(stk?.stockist_name||'')+'</div></div><div class="info-box"><div class="info-label">Submitted</div><div class="info-value">'+formatDate(head.created_at)+'</div></div></div><div class="table-container"><table><thead><tr><th>#</th><th>Product</th><th>PTS</th><th>Primary Qty</th><th>Primary Value</th><th>Secondary Qty</th><th>Secondary Value</th></tr></thead><tbody>';rows.forEach((d,i)=>{const p=+d.primary_value||0,s=+d.secondary_value||0;pv+=p;sv+=s;html+='<tr><td>'+(i+1)+'</td><td class="product-name">'+escapeHTML(map[d.product_id]||'Unknown Product')+'</td><td class="number-cell">'+(+d.pts||0).toFixed(2)+'</td><td class="number-cell">'+(+d.primary_units||0)+'</td><td class="number-cell">'+p.toFixed(2)+'</td><td class="number-cell">'+(+d.secondary_units||0)+'</td><td class="number-cell">'+s.toFixed(2)+'</td></tr>'});if(!rows.length)html+='<tr><td colspan="7">No sales recorded for this submission.</td></tr>';html+='<tr class="totals-row"><td colspan="4">TOTAL</td><td class="number-cell">'+pv.toFixed(2)+'</td><td>-</td><td class="number-cell">'+sv.toFixed(2)+'</td></tr></tbody></table></div>';document.getElementById('resultArea').innerHTML=html}
async function searchTargetSheet(){const m=+document.getElementById('month').value,y=+document.getElementById('year').value,h=document.getElementById('hq').value;if(!m||!y||!h){showMessage('Please select Month, Year and HQ.','error');return}const area=document.getElementById('resultArea'),b=document.getElementById('searchButton');area.innerHTML='<div class="loading">Loading target sheets...</div>';b.disabled=true;try{if(h==='ALL'){await searchAllHQTargets(m,y);return}const{data:targets,error:te}=await client.from('targets').select('product_id,target_pts,target_units,target_value').eq('month',m).eq('year',y).eq('hq_id',h);if(te)throw te;if(!targets||!targets.length){area.innerHTML='<div class="loading">No target sheet found for the selected Month, Year and HQ.</div>';return}const ids=targets.map(t=>t.product_id);const{data:products,error:pe}=await client.from('products').select('id,product_name').in('id',ids);if(pe)throw pe;const{data:hq,error:qe}=await client.from('hqs').select('id,hq_name').eq('id',h).single();if(qe)throw qe;renderTargets(m,y,targets,products||[],hq)}catch(e){area.innerHTML='<div class="message error" style="display:block">'+escapeHTML(e.message)+'</div>'}finally{b.disabled=false}}
async function searchAllHQTargets(m,y){const area=document.getElementById('resultArea');const{data:targets,error:te}=await client.from('targets').select('hq_id,product_id,target_pts,target_units,target_value').eq('month',m).eq('year',y);if(te)throw te;if(!targets||!targets.length){area.innerHTML='<div class="loading">No target data found for the selected Month and Year.</div>';return}const hqIds=[...new Set(targets.map(t=>t.hq_id))];const productIds=[...new Set(targets.map(t=>t.product_id))];const[{data:hqs,error:he},{data:products,error:pe}]=await Promise.all([client.from('hqs').select('id,hq_name').in('id',hqIds).order('hq_name'),client.from('products').select('id,product_name').in('id',productIds).order('product_name')]);if(he)throw he;if(pe)throw pe;const hqMap={};(hqs||[]).forEach(h=>hqMap[h.id]=h.hq_name);const productMap={};(products||[]).forEach(p=>productMap[p.id]=p.product_name);const grouped={};targets.forEach(t=>{const key=t.hq_id+'|'+t.product_id;if(!grouped[key])grouped[key]={hq_id:t.hq_id,product_id:t.product_id,units:0,value:0,pts:Number(t.target_pts)||0};grouped[key].units+=Number(t.target_units)||0;grouped[key].value+=Number(t.target_value)||0});const byProduct={};Object.values(grouped).forEach(r=>{if(!byProduct[r.product_id])byProduct[r.product_id]={product_id:r.product_id,units:0,value:0,byHQ:{}};byProduct[r.product_id].units+=r.units;byProduct[r.product_id].value+=r.value;byProduct[r.product_id].byHQ[r.hq_id]=r});const sortedHQs=(hqs||[]).slice().sort((a,b)=>a.hq_name.localeCompare(b.hq_name));const sortedProducts=Object.values(byProduct).sort((a,b)=>(productMap[a.product_id]||'').localeCompare(productMap[b.product_id]||'',undefined,{sensitivity:'base'}));let html='<h3>Submitted Targets — All HQs</h3><div class="submission-info"><div class="info-box"><div class="info-label">Month</div><div class="info-value">'+getMonthName(m)+' '+y+'</div></div><div class="info-box"><div class="info-label">HQs with Targets</div><div class="info-value">'+sortedHQs.length+'</div></div><div class="info-box"><div class="info-label">Products</div><div class="info-value">'+sortedProducts.length+'</div></div><div class="info-box"><div class="info-label">View</div><div class="info-value">Cumulative + HQ-wise</div></div></div><div class="table-container"><table><thead><tr><th>Product</th><th>ABM Total Units</th><th>ABM Total Value</th>';sortedHQs.forEach(hq=>html+='<th>'+escapeHTML(hq.hq_name)+' Units</th><th>'+escapeHTML(hq.hq_name)+' Value</th>');html+='</tr></thead><tbody>';let grandUnits=0,grandValue=0;sortedProducts.forEach(r=>{grandUnits+=r.units;grandValue+=r.value;html+='<tr><td class="product-name">'+escapeHTML(productMap[r.product_id]||'Unknown Product')+'</td><td class="number-cell">'+formatNumber(r.units)+'</td><td class="number-cell">'+formatValue(r.value)+'</td>';sortedHQs.forEach(hq=>{const x=r.byHQ[hq.id];html+='<td class="number-cell">'+formatNumber(x?x.units:0)+'</td><td class="number-cell">'+formatValue(x?x.value:0)+'</td>'});html+='</tr>'});html+='<tr class="abm-row"><td>ABM TOTAL</td><td class="number-cell">'+formatNumber(grandUnits)+'</td><td class="number-cell">'+formatValue(grandValue)+'</td>';sortedHQs.forEach(hq=>{let u=0,v=0;sortedProducts.forEach(r=>{const x=r.byHQ[hq.id];if(x){u+=x.units;v+=x.value}});html+='<td class="number-cell">'+formatNumber(u)+'</td><td class="number-cell">'+formatValue(v)+'</td>'});html+='</tr></tbody></table></div>';area.innerHTML=html}
function renderTargets(m,y,targets,products,hq){const map={};products.forEach(p=>map[p.id]=p.product_name);const rows=[...targets].sort((a,b)=>(map[a.product_id]||'').localeCompare(map[b.product_id]||'',undefined,{sensitivity:'base'}));let units=0,value=0,html='<h3>Submitted Target Sheet</h3><div class="submission-info"><div class="info-box"><div class="info-label">Month</div><div class="info-value">'+getMonthName(m)+' '+y+'</div></div><div class="info-box"><div class="info-label">HQ</div><div class="info-value">'+escapeHTML(hq?.hq_name||'')+'</div></div><div class="info-box"><div class="info-label">Products</div><div class="info-value">'+rows.length+'</div></div><div class="info-box"><div class="info-label">Type</div><div class="info-value">Monthly Target</div></div></div><div class="table-container"><table><thead><tr><th>#</th><th>Product</th><th>PTS</th><th>Target Units</th><th>Target Value</th></tr></thead><tbody>';rows.forEach((r,i)=>{const u=+r.target_units||0,v=+r.target_value||0;units+=u;value+=v;html+='<tr><td>'+(i+1)+'</td><td class="product-name">'+escapeHTML(map[r.product_id]||'Unknown Product')+'</td><td class="number-cell">'+(+r.target_pts||0).toFixed(2)+'</td><td class="number-cell">'+u+'</td><td class="number-cell">'+v.toFixed(2)+'</td></tr>'});html+='<tr class="totals-row"><td colspan="3">TOTAL</td><td class="number-cell">'+units+'</td><td class="number-cell">'+value.toFixed(2)+'</td></tr></tbody></table></div>';document.getElementById('resultArea').innerHTML=html}
function formatNumber(v){return(Number(v)||0).toLocaleString('en-IN',{maximumFractionDigits:2})}function formatValue(v){return(Number(v)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}function getMonthName(m){return['','January','February','March','April','May','June','July','August','September','October','November','December'][m]||''}function formatDate(v){if(!v)return'';return new Date(v).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}function escapeHTML(t){const d=document.createElement('div');d.textContent=t??'';return d.innerHTML}function showMessage(t,type){const m=document.getElementById('message');m.textContent=t;m.className='message '+type;m.style.display='block'}function goHome(){location.href='home.html'}initializePage();
</script>
</body>
</html>
