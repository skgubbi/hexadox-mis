<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Hexadox MIS - Submitted Data</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f6;color:#222}.header{background:#008f87;color:#fff;padding:18px 25px;display:flex;justify-content:space-between;align-items:center}.header h2{margin:0;font-size:22px}.back-button{background:#fff;color:#008f87;border:0;padding:9px 16px;border-radius:5px;cursor:pointer;font-weight:bold}.container{max-width:1250px;margin:25px auto;padding:0 15px}.card{background:#fff;padding:22px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:20px}.card h3{margin-top:0;color:#008f87}.view-toggle{display:flex;gap:10px;margin-bottom:20px}.view-button{border:1px solid #008f87;background:#fff;color:#008f87;padding:10px 18px;border-radius:6px;font-weight:bold;cursor:pointer}.view-button.active{background:#008f87;color:#fff}.selection-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}label{display:block;font-weight:bold;margin-bottom:7px}select{width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;font-size:15px}select:disabled{background:#eee}.search-area{text-align:center;margin-top:20px}.search-button{background:#008f87;color:#fff;border:0;padding:12px 40px;border-radius:6px;font-size:16px;font-weight:bold;cursor:pointer}.search-button:disabled{background:#999;cursor:not-allowed}.table-container{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}th{background:#008f87;color:#fff;padding:11px 8px;text-align:center}td{padding:8px;border-bottom:1px solid #ddd;text-align:center}td.product-name{text-align:left;font-weight:500}.number-cell{text-align:right}.totals-row{font-weight:bold;background:#f1f5f5}.abm-row{font-weight:bold;background:#fff2b8;border-top:2px solid #d7ad00}.submission-info{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.info-box{background:#f5f8f8;padding:12px;border-radius:6px}.info-label{font-size:12px;color:#666;margin-bottom:5px}.info-value{font-weight:bold}.message{margin-top:15px;padding:12px;border-radius:5px;display:none;text-align:center;font-weight:bold}.error{background:#f8d7da;color:#842029}.loading{text-align:center;padding:25px;font-weight:bold;color:#008f87}@media(max-width:800px){.selection-grid{grid-template-columns:repeat(2,1fr)}.submission-info{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.selection-grid,.submission-info{grid-template-columns:1fr}.header h2{font-size:18px}}
</style>
</head>
<body>
<div class="header"><h2>HEXADOX MIS — SUBMITTED DATA</h2><button class="back-button" onclick="goHome()">HOME</button></div>
<div class="container"><div class="card"><h3>Find Submission</h3><div class="view-toggle"><button id="salesViewButton" class="view-button active" onclick="setView('sales')">SUBMITTED SALES</button><button id="targetViewButton" class="view-button" onclick="setView('targets')">SUBMITTED TARGETS</button></div><div class="selection-grid"><div><label>Month</label><select id="month"><option value="">Select Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select></div><div><label>Year</label><select id="year"><option value="">Select Year</option></select></div><div><label>HQ</label><select id="hq"><option value="">Loading HQ...</option></select></div><div id="stockistFilter"><label>Stockist</label><select id="stockist" disabled><option value="">Select Stockist</option></select></div></div><div class="search-area"><button id="searchButton" class="search-button" onclick="runSearch()">SEARCH</button></div></div><div class="card"><div id="resultArea"><div class="loading">Select the filters and click SEARCH.</div></div></div><div id="message" class="message"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script>
<script>
let currentView='sales';
const $=id=>document.getElementById(id);const monthName=m=>['','January','February','March','April','May','June','July','August','September','October','November','December'][m]||'';const num=v=>(Number(v)||0).toLocaleString('en-IN',{maximumFractionDigits:2});const money=v=>(Number(v)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});const esc=t=>{const d=document.createElement('div');d.textContent=t??'';return d.innerHTML};
async function initializePage(){const{data,error}=await client.auth.getSession();if(error||!data.session){location.href='index.html';return}loadYears();await loadHQs()}
function loadYears(){const s=$('year'),y=new Date().getFullYear();for(let n=y-2;n<=y+1;n++)s.appendChild(new Option(n,n));s.value=y;$('month').value=new Date().getMonth()+1}
async function loadHQs(){const s=$('hq');const{data,error}=await client.from('hqs').select('id,hq_name').eq('active',true).order('hq_name');if(error){showMessage('Unable to load HQs: '+error.message,'error');return}s.innerHTML='<option value="">Select HQ</option><option value="ALL">All HQs</option>';(data||[]).forEach(h=>s.appendChild(new Option(h.hq_name,h.id)))}
$('hq').addEventListener('change',()=>{if(currentView==='sales')loadStockists()});
async function loadStockists(){const h=$('hq').value,s=$('stockist');s.disabled=true;s.innerHTML='<option value="">Loading Stockists...</option>';if(!h||h==='ALL'){s.innerHTML='<option value="">Select Stockist</option>';return}const{data,error}=await client.from('stockists').select('id,stockist_name').eq('hq_id',h).eq('active',true).order('stockist_name');if(error){showMessage('Unable to load stockists: '+error.message,'error');return}s.innerHTML='<option value="">Select Stockist</option>';(data||[]).forEach(x=>s.appendChild(new Option(x.stockist_name,x.id)));s.disabled=false}
function setView(v){currentView=v;$('salesViewButton').classList.toggle('active',v==='sales');$('targetViewButton').classList.toggle('active',v==='targets');$('stockistFilter').style.display=v==='targets'?'none':'block';$('resultArea').innerHTML='<div class="loading">Select the filters and click SEARCH.</div>';if(v==='sales')loadStockists()}
function runSearch(){currentView==='targets'?searchTargets():searchSales()}
async function searchSales(){const m=+$('month').value,y=+$('year').value,h=$('hq').value,s=$('stockist').value;if(!m||!y||!h||h==='ALL'||!s){showMessage('Please select Month, Year, HQ and Stockist.','error');return}const area=$('resultArea');area.innerHTML='<div class="loading">Searching...</div>';try{const{data:heads,error}=await client.from('sales_entry_header').select('id,stockist_id,hq_id,month,year,created_at').eq('stockist_id',s).eq('hq_id',h).eq('month',m).eq('year',y).limit(1);if(error)throw error;if(!heads?.length){area.innerHTML='<div class="loading">No submitted data found.</div>';return}const head=heads[0];const{data:details,error:de}=await client.from('sales_entry_details').select('product_id,pts,primary_units,secondary_units,primary_value,secondary_value').eq('entry_id',head.id);if(de)throw de;const ids=(details||[]).map(d=>d.product_id);const[{data:products,error:pe},{data:hq,error:he},{data:stk,error:se}]=await Promise.all([client.from('products').select('id,product_name').in('id',ids),client.from('hqs').select('id,hq_name').eq('id',h).single(),client.from('stockists').select('id,stockist_name').eq('id',s).single()]);if(pe||he||se)throw(pe||he||se);const map={};(products||[]).forEach(p=>map[p.id]=p.product_name);let pv=0,sv=0,html='<h3>Submitted Sales</h3><p><b>'+monthName(m)+' '+y+'</b> &nbsp; | &nbsp; '+esc(hq.hq_name)+' &nbsp; | &nbsp; '+esc(stk.stockist_name)+'</p><div class="table-container"><table><thead><tr><th>Product</th><th>PTS</th><th>Primary Qty</th><th>Primary Value</th><th>Secondary Qty</th><th>Secondary Value</th></tr></thead><tbody>';for(const d of details||[]){const p=+d.primary_value||0,s2=+d.secondary_value||0;pv+=p;sv+=s2;html+='<tr><td class="product-name">'+esc(map[d.product_id]||'Unknown')+'</td><td class="number-cell">'+(+d.pts||0).toFixed(2)+'</td><td class="number-cell">'+num(d.primary_units)+'</td><td class="number-cell">'+money(p)+'</td><td class="number-cell">'+num(d.secondary_units)+'</td><td class="number-cell">'+money(s2)+'</td></tr>'}html+='<tr class="totals-row"><td colspan="3">TOTAL</td><td class="number-cell">'+money(pv)+'</td><td></td><td class="number-cell">'+money(sv)+'</td></tr></tbody></table></div>';area.innerHTML=html}catch(e){area.innerHTML='<div class="message error" style="display:block">'+esc(e.message)+'</div>'}}
async function searchTargets(){const m=+$('month').value,y=+$('year').value,h=$('hq').value;if(!m||!y||!h){showMessage('Please select Month, Year and HQ.','error');return}const area=$('resultArea');area.innerHTML='<div class="loading">Loading target sheets...</div>';try{if(h==='ALL'){await searchAllTargets(m,y);return}const{data:targets,error}=await client.from('targets').select('product_id,target_pts,target_units,target_value').eq('month',m).eq('year',y).eq('hq_id',h);if(error)throw error;if(!targets?.length){area.innerHTML='<div class="loading">No target sheet found for the selected Month, Year and HQ.</div>';return}const ids=targets.map(t=>t.product_id);const[{data:products,error:pe},{data:hq,error:he}]=await Promise.all([client.from('products').select('id,product_name').in('id',ids),client.from('hqs').select('id,hq_name').eq('id',h).single()]);if(pe||he)throw(pe||he);renderSingleTarget(m,y,targets,products||[],hq)}catch(e){area.innerHTML='<div class="message error" style="display:block">'+esc(e.message)+'</div>'}}
async function searchAllTargets(m,y){const area=$('resultArea');const{data:targets,error}=await client.from('targets').select('product_id,target_units').eq('month',m).eq('year',y);if(error)throw error;if(!targets?.length){area.innerHTML='<div class="loading">No target data found for the selected Month and Year.</div>';return}const productIds=[...new Set(targets.map(t=>t.product_id))];const{data:products,error:pe}=await client.from('products').select('id,product_name').in('id',productIds);if(pe)throw pe;const map={};(products||[]).forEach(p=>map[p.id]=p.product_name);const grouped={};targets.forEach(t=>{grouped[t.product_id]=(grouped[t.product_id]||0)+(Number(t.target_units)||0)});const rows=Object.entries(grouped).sort((a,b)=>(map[a[0]]||'').localeCompare(map[b[0]]||'',undefined,{sensitivity:'base'}));let total=0,html='<h3>Submitted Targets — All HQs</h3><p><b>'+monthName(m)+' '+y+'</b> &nbsp; | &nbsp; <b>Cumulative ABM Target</b></p><div class="table-container"><table><thead><tr><th>Product</th><th>Cumulative Target Units</th></tr></thead><tbody>';rows.forEach(([id,units])=>{total+=units;html+='<tr><td class="product-name">'+esc(map[id]||'Unknown Product')+'</td><td class="number-cell">'+num(units)+'</td></tr>'});html+='<tr class="abm-row"><td>ABM TOTAL</td><td class="number-cell">'+num(total)+'</td></tr></tbody></table></div>';area.innerHTML=html}
function renderSingleTarget(m,y,targets,products,hq){const map={};products.forEach(p=>map[p.id]=p.product_name);const rows=[...targets].sort((a,b)=>(map[a.product_id]||'').localeCompare(map[b.product_id]||'',undefined,{sensitivity:'base'}));let units=0,html='<h3>Submitted Target Sheet</h3><p><b>'+monthName(m)+' '+y+'</b> &nbsp; | &nbsp; '+esc(hq?.hq_name||'')+'</p><div class="table-container"><table><thead><tr><th>Product</th><th>Target Units</th></tr></thead><tbody>';rows.forEach(r=>{const u=+r.target_units||0;units+=u;html+='<tr><td class="product-name">'+esc(map[r.product_id]||'Unknown Product')+'</td><td class="number-cell">'+num(u)+'</td></tr>'});html+='<tr class="totals-row"><td>TOTAL</td><td class="number-cell">'+num(units)+'</td></tr></tbody></table></div>';$("resultArea").innerHTML=html}
function showMessage(t,type){const m=$('message');m.textContent=t;m.className='message '+type;m.style.display='block'}function goHome(){location.href='home.html'}initializePage();
</script></body></html>
